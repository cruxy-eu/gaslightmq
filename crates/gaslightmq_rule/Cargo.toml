[package]
name = "gaslightmq_rule"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The check that the tests of a store of rules and of presets run. It brings no runtime.
conformance = ["dep:gaslightmq_definition_conformance"]
# The store of rules and of presets in memory.
memory = ["dep:gaslightmq_definition_memory"]
serde = [
    "dep:serde",
    "gaslightmq_incident/serde",
    "gaslightmq_lie/serde",
    "gaslightmq_selector/serde",
    "gaslightmq_trigger/serde",
]

[dependencies]
gaslightmq_clock.workspace = true
gaslightmq_definition_api.workspace = true
gaslightmq_definition_conformance = { workspace = true, optional = true }
gaslightmq_definition_memory = { workspace = true, optional = true }
gaslightmq_field.workspace = true
gaslightmq_incident.workspace = true
gaslightmq_kernel.workspace = true
gaslightmq_lie.workspace = true
gaslightmq_resource.workspace = true
gaslightmq_selector.workspace = true
gaslightmq_trigger.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
# The executor that drives the stores in `tests/store.rs`. The crate itself needs no runtime.
futures.workspace = true
# The store in memory and the checks of a store, which `tests/store.rs` runs. A test turns the features on.
gaslightmq_rule = { workspace = true, features = ["conformance", "memory"] }
gaslightmq_definition_memory.workspace = true
serde_json.workspace = true
