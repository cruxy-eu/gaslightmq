[package]
name = "gaslightmq_surface_conformance"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Only the tests of a crate depend on this one: `cargo xtask test-support` holds every crate to that.
[package.metadata.gaslightmq]
test_support = true

[dependencies]
gaslightmq_definition_conformance.workspace = true
gaslightmq_surface.workspace = true
# The names of the presets and the selectors that the layouts of the check have columns and rows for.
gaslightmq_rule.workspace = true
gaslightmq_selector.workspace = true

[dev-dependencies]
# The executor that drives the check in the tests and the example. The crate itself needs no runtime.
futures.workspace = true
# The store in memory, which the tests and the example hold to the check.
gaslightmq_definition_memory.workspace = true
gaslightmq_surface = { workspace = true, features = ["memory"] }
