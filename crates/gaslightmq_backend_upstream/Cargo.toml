[package]
name = "gaslightmq_backend_upstream"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The modules that decide and never wait: `cargo xtask sans-io` holds them to that.
[package.metadata.gaslightmq]
sans_io_modules = ["brokers", "cluster", "configuration", "error", "in_flight"]

[dependencies]
gaslightmq_backend.workspace = true
gaslightmq_clock.workspace = true
gaslightmq_environment.workspace = true
gaslightmq_field.workspace = true
gaslightmq_incident.workspace = true
gaslightmq_kernel.workspace = true
gaslightmq_overlay.workspace = true
gaslightmq_wire.workspace = true
bytes.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "macros", "time"] }
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
# The preludes that code imports next to this one. `tests/prelude.rs` checks that no name clashes.
gaslightmq_call.workspace = true
# The call IDs of a proxy, which the tests in `tests/fake_cluster` forward their requests under.
gaslightmq_session.workspace = true
# A real Kafka cluster for the tests in `tests/real_cluster`.
gaslightmq_test_kafka.workspace = true
