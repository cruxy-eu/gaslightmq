[package]
name = "gaslightmq-proxy"
version.workspace = true
edition.workspace = true

[features]
# Embed the web UI from `ui-dist/` (built with `just ui`) and serve it on the
# control port.
proxy-ui = ["dep:rust-embed"]

[dependencies]
gaslightmq-proxy-api.workspace = true
gaslightmq-wire.workspace = true
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
kafka-protocol.workspace = true
rand.workspace = true
rust-embed = { workspace = true, optional = true, features = ["mime-guess"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
