[package]
name = "gaslightmq_listener"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The modules that hold values and never wait: `cargo xtask sans-io` holds them to that.
[package.metadata.gaslightmq]
sans_io_modules = ["configuration", "error", "numbers"]

[dependencies]
gaslightmq_clock.workspace = true
gaslightmq_field.workspace = true
gaslightmq_wire.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "sync", "macros", "time"] }
tracing.workspace = true

[dev-dependencies]
# A real Kafka client for the tests, and the broker ID of an endpoint.
gaslightmq_kafka_client_api.workspace = true
gaslightmq_kernel.workspace = true
