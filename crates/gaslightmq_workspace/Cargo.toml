[package]
name = "gaslightmq_workspace"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The stores of a workspace in memory, the context over them, and UUIDs that a test knows before they are made.
memory = [
    "dep:gaslightmq_definition_memory",
    "gaslightmq_environment/memory",
    "gaslightmq_rule/memory",
    "gaslightmq_selector/memory",
    "gaslightmq_surface/memory",
]

[dependencies]
gaslightmq_definition_api.workspace = true
gaslightmq_definition_memory = { workspace = true, optional = true }
gaslightmq_environment.workspace = true
gaslightmq_rule.workspace = true
gaslightmq_selector.workspace = true
gaslightmq_surface.workspace = true
thiserror.workspace = true

[dev-dependencies]
anyhow.workspace = true
# The executor that drives the workspace in the tests and the examples. The crate itself needs no runtime.
futures.workspace = true
# The context of the tests and the examples: stores in memory, and UUIDs that a test knows. A test turns the feature on.
gaslightmq_workspace = { workspace = true, features = ["memory"] }
# The store in memory, for the stores of a test of which one fails.
gaslightmq_definition_memory.workspace = true
# What the definitions of the tests are made of.
gaslightmq_clock.workspace = true
gaslightmq_field.workspace = true
gaslightmq_kernel.workspace = true
gaslightmq_lie.workspace = true
# The preludes that code imports next to this one. `tests/prelude.rs` checks that no name clashes.
gaslightmq_incident.workspace = true
gaslightmq_trigger.workspace = true
