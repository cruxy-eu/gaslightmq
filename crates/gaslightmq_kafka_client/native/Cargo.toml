[package]
name = "gaslightmq_kafka_client_native"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The modules that decide and never wait: `cargo xtask sans-io` holds them to that.
[package.metadata.gaslightmq]
sans_io_modules = ["logic", "error", "configuration", "address"]

[dependencies]
gaslightmq_clock.workspace = true
gaslightmq_kafka_client_api.workspace = true
gaslightmq_kernel.workspace = true
gaslightmq_wire.workspace = true
bytes.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync"] }
tracing.workspace = true

[dev-dependencies]
# A real Kafka cluster for the tests in `tests/kafka`.
gaslightmq_test_kafka.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
