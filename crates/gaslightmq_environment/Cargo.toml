[package]
name = "gaslightmq_environment"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The check that the tests of a store of environments run. It brings no runtime.
conformance = ["dep:gaslightmq_definition_conformance"]
# The store of environments in memory.
memory = ["dep:gaslightmq_definition_memory"]
serde = ["dep:serde", "gaslightmq_kernel/serde"]

[dependencies]
gaslightmq_definition_api.workspace = true
gaslightmq_definition_conformance = { workspace = true, optional = true }
gaslightmq_definition_memory = { workspace = true, optional = true }
gaslightmq_kernel.workspace = true
gaslightmq_resource.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
# The executor that drives the store in `tests/store.rs`. The crate itself needs no runtime.
futures.workspace = true
# The store in memory and the check of a store, which `tests/store.rs` runs. A test turns the features on.
gaslightmq_environment = { workspace = true, features = ["conformance", "memory"] }
gaslightmq_definition_memory.workspace = true
# The preludes that code imports next to this one. `tests/prelude.rs` checks that no name clashes.
gaslightmq_call.workspace = true
gaslightmq_combine.workspace = true
gaslightmq_field.workspace = true
gaslightmq_incident.workspace = true
gaslightmq_lie.workspace = true
gaslightmq_rule.workspace = true
gaslightmq_selector.workspace = true
gaslightmq_trigger.workspace = true
serde.workspace = true
serde_json.workspace = true
