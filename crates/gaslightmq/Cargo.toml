[package]
name = "gaslightmq"
version.workspace = true
edition.workspace = true

[features]
# Embed the proxy web UI (built with `just ui`).
proxy-ui = ["gaslightmq-proxy/proxy-ui"]

[dependencies]
gaslightmq-kernel.workspace = true
gaslightmq-scenario.workspace = true
gaslightmq-wire.workspace = true
gaslightmq-proxy.workspace = true
anyhow.workspace = true
bytes.workspace = true
indexmap.workspace = true
kafka-protocol.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "rt-multi-thread", "macros", "sync"] }
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
fake = { workspace = true, features = ["derive"] }
rand.workspace = true
uuid = { workspace = true, features = ["v4"] }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio-tungstenite.workspace = true
gaslightmq-kernel.workspace = true
gaslightmq-testing.workspace = true
gaslightmq-kafka-client-api.workspace = true
gaslightmq-kafka-client-native.workspace = true
bytes.workspace = true
indexmap.workspace = true
kafka-protocol.workspace = true
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
