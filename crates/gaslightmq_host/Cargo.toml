[package]
name = "gaslightmq_host"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The modules that hold values and never wait: `cargo xtask sans-io` holds them to that.
[package.metadata.gaslightmq]
sans_io_modules = ["configuration", "error"]

[dependencies]
gaslightmq_backend.workspace = true
gaslightmq_backend_upstream.workspace = true
gaslightmq_clock.workspace = true
gaslightmq_clock_waitable.workspace = true
gaslightmq_definition_api.workspace = true
gaslightmq_engine.workspace = true
gaslightmq_environment.workspace = true
gaslightmq_field.workspace = true
gaslightmq_incident.workspace = true
gaslightmq_lie_api.workspace = true
gaslightmq_quick_inject.workspace = true
gaslightmq_rule.workspace = true
gaslightmq_selector.workspace = true
gaslightmq_surface.workspace = true
gaslightmq_traffic.workspace = true
gaslightmq_workspace.workspace = true
futures.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros"] }

[dev-dependencies]
anyhow.workspace = true
# The workspace of every test: stores in memory, and UUIDs that a test knows.
gaslightmq_workspace = { workspace = true, features = ["memory"] }
# The proxies of `tests/real_cluster`: a real client in front, and real Kafka brokers behind.
gaslightmq_kafka_client_native.workspace = true
gaslightmq_test_kafka.workspace = true
# What a test arms and reads: the definitions of lies, the refusal that the build of a test registers, and Kafka's names.
gaslightmq_kernel.workspace = true
gaslightmq_lie.workspace = true
gaslightmq_lie_refusal.workspace = true
gaslightmq_trigger.workspace = true
gaslightmq_wire.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time"] }
