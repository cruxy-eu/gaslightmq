<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GaslightMQ — UI mockups v2</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
:root{
  --bg:#08090a; --bg2:#0c0d0f; --panel:#0f1012; --surface:#16171a; --surface2:#1c1d21; --surface3:#24252a;
  --hover:rgba(255,255,255,.035); --sel:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.065); --border2:rgba(255,255,255,.1); --border3:rgba(255,255,255,.17);
  --t1:#f7f8f8; --t2:#d0d6e0; --t3:#8a8f98; --t4:#62666d; --t5:#3e4147;
  --accent:#7170ff; --accent2:#5e6ad2;
  --red:#eb5757; --orange:#f2994a; --violet:#a78bfa; --blue:#4ea7fc; --green:#4cb782; --yellow:#f2c94c; --teal:#2dd4bf;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--t2);font:13px/1.45 "Inter var",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv01","cv11","ss03";overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
.i{flex:none;display:block}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:0}
.t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t5{color:var(--t5)}
.sp{flex:1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26272b;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}

/* ── mockup switcher (not part of the design) ── */
.mbar{height:46px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid #161616;background:#000}
.mbar .brand{font-weight:600;color:var(--t1);font-size:12.5px;white-space:nowrap}
.mbar .brand small{color:var(--t4);font-weight:500;margin-left:6px}
.mtabs{display:flex;gap:2px;background:#0d0d0e;border:1px solid #1d1d1f;border-radius:8px;padding:2px}
.mtabs button{height:28px;padding:0 10px;border-radius:6px;color:var(--t3);font-size:12.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.mtabs button:hover{color:var(--t1)}
.mtabs button.on{background:#1f2023;color:var(--t1)}
.mtabs .n{font:500 10.5px var(--mono);color:var(--t4)}
.mdesc{color:var(--t3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#stage{height:calc(100vh - 46px);padding:8px}

/* ── app shell ── */
.app{height:100%;display:grid;grid-template-columns:226px minmax(0,1fr);background:var(--bg);border:1px solid #17181a;border-radius:10px;overflow:hidden;position:relative}
.side{display:flex;flex-direction:column;padding:10px 8px;min-height:0;overflow:auto}
.ws{display:flex;align-items:center;gap:8px;padding:2px 4px 2px 6px;height:32px}
.logo{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#7170ff,#c084fc 55%,#f2994a);flex:none}
.ws b{color:var(--t1);font-weight:600;font-size:13px}
.ib{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--t3);flex:none}
.ib:hover{background:var(--hover);color:var(--t1)}
.recbtn{margin:8px 2px 12px;height:30px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--t2);font-size:12.5px;font-weight:500}
.recbtn:hover{background:var(--surface2)}
.recbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--t4)}
.recbtn.on .dot{background:var(--red);box-shadow:0 0 0 3px rgba(235,87,87,.2);animation:pulse 1.6s infinite}
.recbtn .mono{margin-left:auto;color:var(--t3)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(235,87,87,.04)}}
.nav{display:flex;align-items:center;gap:9px;height:28px;padding:0 8px;border-radius:6px;color:var(--t2);cursor:pointer;white-space:nowrap}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);color:var(--t1)}
.nav .i{color:var(--t3)} .nav.on .i{color:var(--t1)}
.nav .cnt{margin-left:auto;font-size:11.5px;color:var(--t4)}
.sec{font-size:11.5px;font-weight:500;color:var(--t4);padding:16px 8px 5px;display:flex;align-items:center;gap:6px}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.sfoot{margin-top:auto;padding:14px 2px 2px;display:flex;flex-direction:column;gap:8px}
.hw{border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:var(--bg2);display:flex;gap:10px;align-items:center;cursor:pointer}
.hw:hover{border-color:var(--border2)}
.mini{display:grid;grid-template-columns:repeat(8,4px);gap:2px;flex:none}
.mini i{width:4px;height:4px;border-radius:1px;background:#25262b}
.addr{display:flex;align-items:center;gap:7px;font:11px var(--mono);color:var(--t4);padding:0 8px}
.addr i{width:6px;height:6px;border-radius:50%;background:var(--green)}

.main{margin:8px 8px 8px 0;background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.hdr{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-bottom:1px solid var(--border)}
.crumb{display:flex;align-items:center;gap:7px;color:var(--t1);font-weight:500;white-space:nowrap}
.crumb .i{color:var(--t3)}
.btn{height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);color:var(--t2);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.btn:hover{background:var(--surface2);color:var(--t1)}
.btn.primary{background:var(--accent2);border-color:rgba(255,255,255,.1);color:#fff}
.btn.primary:hover{background:#6973e3}
.btn.ghost{border-color:transparent;background:transparent;color:var(--t3)}
.btn.ghost:hover{background:var(--hover);color:var(--t1)}
.btn .kbd{margin-left:2px}
.btn.primary .kbd{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.25)}
.kbd{font:500 10.5px var(--mono);color:var(--t3);border:1px solid var(--border2);border-radius:4px;padding:0 4px;height:17px;display:inline-flex;align-items:center;background:rgba(255,255,255,.02)}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px;flex:none}
.seg button{height:22px;padding:0 9px;border-radius:5px;font-size:12px;color:var(--t3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--t1)}
.seg button.on{background:var(--surface3);color:var(--t1);box-shadow:0 0 0 1px var(--border) inset}
.seg.f button.on{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent) inset}
.tab{height:26px;padding:0 10px;border-radius:6px;font-size:12.5px;color:var(--t3);border:1px solid transparent;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--t1)}
.tab.on{color:var(--t1);border-color:var(--border2);background:var(--surface)}
.tab .t4{font-size:11.5px}

.api{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px 0 6px;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,.025);font-size:11.5px;color:var(--t2);white-space:nowrap;font-weight:500;flex:none}
.api i{width:6px;height:6px;border-radius:2px;background:var(--c)}
.api .v{color:var(--t4);font-weight:400;font-family:var(--mono);font-size:10.5px}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;background:rgba(255,255,255,.045);font-size:11.5px;color:var(--t2);white-space:nowrap;flex:none}
.tag .i{color:var(--t4)}
.fault{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap;flex:none}
.fault b{font-weight:500;color:var(--t2)}
.fault::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}

.chip{display:inline-flex;align-items:stretch;height:24px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);font-size:12px;overflow:hidden;flex:none}
.chip > span{display:flex;align-items:center;padding:0 7px;border-right:1px solid var(--border);white-space:nowrap}
.chip .f{color:var(--t2);gap:6px}
.chip .f .i{color:var(--t4)}
.chip .o{color:var(--t4)}
.chip .v{color:var(--t1)}
.chip .x{padding:0 5px;color:var(--t4);border-right:0;cursor:pointer}
.chip .x:hover{color:var(--t1);background:var(--hover)}
.chip > span:last-child{border-right:0}

.menu{position:fixed;z-index:60;min-width:220px;background:#1b1c20;border:1px solid var(--border2);border-radius:9px;box-shadow:0 16px 40px rgba(0,0,0,.55);padding:4px;animation:tin .12s ease-out}
.menu .mi{display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;border-radius:6px;color:var(--t2);font-size:12.5px;cursor:pointer}
.menu .mi:hover{background:rgba(255,255,255,.06);color:var(--t1)}
.menu .mi .d{margin-left:auto;color:var(--t4);font-size:11.5px}
.menu .ms{font-size:11px;color:var(--t4);padding:6px 9px 3px}
#toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:#1c1d21;border:1px solid var(--border2);border-radius:9px;padding:10px 14px;color:var(--t1);font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;animation:tin .2s ease-out;max-width:420px}
.toast .i{color:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

/* ── record ── */
.fbar{min-height:42px;flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.fbar .hint{color:var(--t4);font-size:12px}
.rgrid{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(0,1fr) 292px}
.rgrid.sel{grid-template-columns:232px minmax(0,1fr) 430px}
.pane{min-height:0;overflow:auto;border-right:1px solid var(--border);position:relative}
.pane:last-child{border-right:0}
.ph{position:sticky;top:0;z-index:3;background:var(--panel);height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12px;color:var(--t3);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap}
.ph .t4{font-weight:400}
.tree .cl{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 14px;color:var(--t1);cursor:pointer;font-weight:500;margin-top:4px}
.tree .cl .mono{margin-left:auto;color:var(--t4);font-weight:400;font-size:11px}
.tree .sub{font:10.5px var(--mono);color:var(--t4);padding:0 14px 4px 30px;margin-top:-6px}
.tree .cl:hover,.tree .cn:hover{background:var(--hover)}
.tree .cn{display:grid;grid-template-columns:28px 1fr auto 36px;align-items:center;gap:6px;height:25px;padding:0 12px 0 30px;cursor:pointer;color:var(--t3);font-size:12px}
.tree .cn .mono{font-size:11px}
.tree .cn .n{text-align:right;color:var(--t4);font:11px var(--mono)}
.tree .on{background:rgba(113,112,255,.09)!important}
.act{display:flex;gap:1px;align-items:flex-end;height:12px}
.act i{width:2px;background:#33353b;border-radius:1px}
.srow{display:grid;grid-template-columns:84px 150px 24px 170px minmax(0,1fr) 92px 196px;align-items:center;gap:10px;height:32px;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.03);font-size:12px;cursor:pointer;position:relative}
.srow:hover{background:var(--hover)}
.srow.new{animation:flash 1.4s ease-out}
@keyframes flash{from{background:rgba(113,112,255,.13)}to{background:transparent}}
.srow.m::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:rgba(113,112,255,.7)}
.srow.dim{opacity:.38}
.srow.selected{background:rgba(113,112,255,.12)!important;box-shadow:inset 2px 0 0 var(--accent)}
.thead{position:sticky;top:0;z-index:2;background:var(--panel);height:32px;border-bottom:1px solid var(--border);color:var(--t4);font-size:11.5px;cursor:default}
.thead:hover{background:var(--panel)}
.who{display:flex;align-items:center;gap:7px;min-width:0;color:var(--t2)}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .mono{color:var(--t4);flex:none}
.det{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;color:var(--t3)}
.det .tp{color:var(--t2)}
.det .pp{color:var(--t4);font-family:var(--mono);font-size:10.5px}
[data-ff]{cursor:pointer}
.det [data-ff]:hover,.who[data-ff]:hover span{color:var(--t1);text-decoration:underline;text-decoration-color:var(--t4);text-underline-offset:3px}
.lat{display:flex;align-items:center;gap:7px;justify-content:flex-end;font-family:var(--mono);font-size:11px;color:var(--t3)}
.lat i{height:3px;border-radius:2px;background:#3a3c42;display:block}
.out{display:flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;overflow:hidden}
.out .ok{color:var(--t5);font-family:var(--mono);font-size:11px}
.out .r{color:var(--t4);font-family:var(--mono);font-size:10.5px}
.newpill{position:sticky;top:40px;z-index:4;margin:0 auto -26px;width:max-content;display:none;height:26px;padding:0 10px;border-radius:13px;background:var(--accent2);color:#fff;font-size:12px;font-weight:500;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.newpill.show{display:flex}
.facet{padding:12px 14px 8px;border-bottom:1px solid var(--border)}
.facet h4{font-size:12px;font-weight:500;color:var(--t2);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.facet h4 .t4{font-weight:400}
.fv{position:relative;display:flex;align-items:center;gap:8px;height:24px;padding:0 6px;margin:0 -6px;border-radius:5px;font-size:12px;color:var(--t2)}
.fv:hover{background:var(--hover)}
.fv .bar{position:absolute;left:0;top:3px;bottom:3px;border-radius:4px;background:rgba(255,255,255,.04);z-index:0}
.fv > *{position:relative;z-index:1}
.fv .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv .c{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--t4)}
.fv.on{color:var(--t1)}
.fv.on .bar{background:rgba(113,112,255,.2)}
.fv .ck{width:12px;height:12px;border-radius:3px;border:1px solid var(--border3);display:grid;place-items:center;flex:none;color:#fff}
.fv.on .ck{background:var(--accent2);border-color:var(--accent2)}
.fv.pat .nm{color:#b4b3ff;font-family:var(--mono);font-size:11.5px}
.ixnote{padding:10px 14px;font-size:11.5px;color:var(--t4);line-height:1.5;border-bottom:1px solid var(--border)}

/* selector sheet */
.sheet{background:var(--bg2)}
.sh-h{padding:14px 16px 12px;border-bottom:1px solid var(--border)}
.fgrp{font-size:11px;color:var(--t4);padding:12px 16px 4px;font-weight:500;display:flex;gap:6px}
.fld{display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:30px;padding:2px 16px;cursor:pointer}
.fld:hover{background:var(--hover)}
.fld .k{font-family:var(--mono);font-size:11.5px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld .val{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--t2)}
.fld.on .k{color:var(--t1)}
.fld.info{cursor:default}
.fld.info .k{color:var(--t4)}
.fld.info .val{color:var(--t4)}
.cb{width:14px;height:14px;border-radius:4px;border:1px solid var(--border3);display:grid;place-items:center;color:#fff}
.fld.on .cb{background:var(--accent2);border-color:var(--accent2)}
.gen{font-family:var(--mono);font-size:11px;height:20px;padding:0 6px;border-radius:4px;border:1px dashed var(--border3);color:var(--t3)}
.gen:hover{color:var(--t1)}
.gen.on{border-style:solid;border-color:rgba(113,112,255,.6);color:#c4c3ff;background:rgba(113,112,255,.12)}
.mcard{margin:14px 16px 12px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);padding:14px}
.big{font-size:26px;font-weight:600;color:var(--t1);letter-spacing:-.02em;line-height:1.1}
.big span{font-size:12.5px;font-weight:400;color:var(--t3);letter-spacing:0;margin-left:4px}
.bd{display:grid;grid-template-columns:104px 1fr 42px;gap:10px;align-items:center;font-size:12px;height:22px;color:var(--t2)}
.bd .b{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden}
.bd .b i{display:block;height:100%;border-radius:3px}
.bd .n{text-align:right;font:11px var(--mono);color:var(--t4)}
.selx{font-family:var(--mono);font-size:11.5px;line-height:1.75;color:var(--t2);background:#08090a;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:0 16px;white-space:pre}
.selx .k{color:#b4b3ff} .selx .s{color:#8fd6a8} .selx .c{color:var(--t4)}

/* ── rules ── */
.lgrp{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 16px;background:#121316;border-bottom:1px solid var(--border);color:var(--t1);font-weight:500;font-size:12.5px;position:sticky;top:0;z-index:1}
.lgrp .t4{font-weight:400;font-size:12px}
.rrow{display:grid;grid-template-columns:16px 56px minmax(0,1fr) auto 38px 64px 30px 30px;align-items:center;gap:12px;height:40px;padding:0 16px 0 24px;border-bottom:1px solid rgba(255,255,255,.035);cursor:pointer}
.rrow:hover{background:var(--hover)}
.rrow.on{background:var(--sel)}
.rrow .ttl{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.rrow .ttl b{font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:60px}
.rrow.off .ttl b{color:var(--t3)}
.padref{font:500 10.5px var(--mono);color:var(--t3);border:1px solid var(--border2);border-radius:4px;height:18px;display:grid;place-items:center}
.sw{width:26px;height:15px;border-radius:10px;background:var(--surface3);position:relative;transition:.15s;border:1px solid var(--border);cursor:pointer}
.sw::after{content:"";position:absolute;top:1px;left:1px;width:11px;height:11px;border-radius:50%;background:#8d9198;transition:.15s}
.sw.on{background:var(--accent2)}
.sw.on::after{left:12px;background:#fff}
.insp{border-left:1px solid var(--border);overflow:auto;min-height:0}
.insp-in{padding:16px 20px 30px}
.insp h2{font-size:18px;font-weight:600;color:var(--t1);letter-spacing:-.015em;margin:10px 0 4px;outline:0}
.insp p.d{color:var(--t3);font-size:12.5px;margin-bottom:16px}
.prop{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:start;min-height:32px;padding:2px 0}
.prop > label{color:var(--t3);font-size:12.5px;padding-top:6px}
.prop .pv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px}
.pv.col{flex-direction:column;align-items:flex-start}
.slider{position:relative;height:28px;flex:1;cursor:ew-resize;display:flex;align-items:center;min-width:120px;touch-action:none}
.slider .tr{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--surface3)}
.slider .fi{position:absolute;left:0;height:4px;border-radius:2px;background:var(--c,var(--accent))}
.slider .th{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 1px 4px rgba(0,0,0,.6)}
.sval{font-family:var(--mono);font-size:12px;color:var(--t1);width:72px;text-align:right}

const PROWS=[
 {name:'Produce',sub:'orders.*',match:[{f:'api',vals:['Produce']},{f:'topic',vals:['orders.*']}]},
 {name:'Fetch',sub:'orders.*',match:[{f:'api',vals:['Fetch']},{f:'topic',vals:['orders.*']}]},
 {name:'Metadata',sub:'',match:[{f:'api',vals:['Metadata']}]},
 {name:'FindCoordinator',sub:'',match:[{f:'api',vals:['FindCoordinator']}]},
 {name:'Group membership',sub:'join · sync · consumer heartbeat',match:[{f:'api',vals:['JoinGroup','SyncGroup','ConsumerGroupHeartbeat']}]},
 {name:'Heartbeat',sub:'',match:[{f:'api',vals:['Heartbeat']}]},
 {name:'OffsetCommit',sub:'',match:[{f:'api',vals:['OffsetCommit']}]},
 {name:'Transactions',sub:'InitPid · AddParts · EndTxn',match:[{f:'api',vals:['InitProducerId','AddPartitionsToTxn','EndTxn']}]},
];
const PCOLS=[
 {name:'Error',sub:'retriable',c:'#eb5757',fault:'error',code:'NOT_LEADER_OR_FOLLOWER'},
 {name:'Error',sub:'fatal',c:'#d6456f',fault:'error',code:'TOPIC_AUTHORIZATION_FAILED'},
 {name:'Delay',sub:'100 ms',c:'#f2994a',fault:'delay',ms:100},
 {name:'Delay',sub:'1 s',c:'#f2994a',fault:'delay',ms:1000},
 {name:'Delay',sub:'10 s',c:'#f2994a',fault:'delay',ms:10000},
 {name:'Blackhole',sub:'timeout',c:'#a78bfa',fault:'blackhole'},
 {name:'Disconnect',sub:'close socket',c:'#4ea7fc',fault:'disconnect'},
 {name:'Throttle',sub:'throttle_time',c:'#2dd4bf',fault:'throttle',thr:2000},
];
const PSCOPES=[{id:'all',l:'All clients',c:'#7170ff'},...CLIENTS.map(c=>({id:c.id,l:c.id,c:c.color}))];
const padRule=(scope,r,c)=>RULES.find(x=>x.scope===scope&&x.pad&&x.pad[0]===r&&x.pad[1]===c);
const DRAFTS={};
function padParams(scope,r,c){
  const ru=padRule(scope,r,c); if(ru)return ru;
  const k=scope+':'+r+','+c, col=PCOLS[c];
  return DRAFTS[k]||(DRAFTS[k]={fault:col.fault,code:col.code,ms:col.ms||0,jitter:0,thr:col.thr||0,prob:100,every:0,durI:0,firings:0});
}
function ensurePadRule(scope,r,c){
  let ru=padRule(scope,r,c); if(ru)return ru;
  const p=padParams(scope,r,c), row=PROWS[r], col=PCOLS[c];
  ru={id:++RID,title:`${col.name} ${col.sub} on ${row.name}${row.sub&&!row.sub.includes('·')?' '+row.sub:''}`,desc:'Live rule from the pad grid.',scope,match:JSON.parse(JSON.stringify(row.match)),
      fault:col.fault,stage:defStage(col.fault),code:p.code,ms:p.ms,jitter:p.jitter,thr:p.thr,prob:p.prob,every:p.every,durI:p.durI,firings:p.firings,status:'disarmed',live:true,pad:[r,c],dur:'Until disarmed'};
  RULES.push(ru); return ru;
}

  });

let tickN=0;
function fieldsOf(r){
  const F=[],add=(g,f,k,v,o={})=>F.push({g,f,k,v,on:false,gen:false,depth:0,...o});
  const name=API[r.api][0];
  add('header','api','api_key',name,{d:`${name} (${r.api})`,on:true});
  add('header','ver','api_version',String(r.ver));
  add('header','client','client_id',r.client,{on:true});
  add('header','sw','client_software',r.sw);
  add('conn','conn','connection','#'+r.conn,{d:`#${r.conn} · ${hostOf(r.conn)}:5${1200+r.conn*37}`});
  add('conn','host','host',hostOf(r.conn));
  add('conn','broker','endpoint','b'+r.broker,{d:`broker ${r.broker} · ${BROKERS[r.broker-1].up}`});
  if(r.acks!=null)add('body','acks','acks',String(r.acks));
  if(r.api===0||r.txn)add('body','txn','transactional_id',r.txn||'null',{f:r.txn?'txn':null});
  if(r.group)add(r.api===1?'learned':'body','group',r.api===1?'group':'group_id',r.group,{on:r.api!==1});
  r.topics.forEach((t,i)=>{
    const pre=t.name.split('.')[0], alt=TOPICS.filter(x=>x.startsWith(pre+'.')).length>1?pre+'.*':null;
    add('body','topic',`topics[${i}].name`,t.name,{alt,gen:!!alt,on:i===0});
    t.p.forEach(p=>add('body','partition',`partitions[].index`,String(p),{depth:1}));
  });
  if(r.records)add('body',null,'records',`${r.records} · ${fmtB(r.bytes)}`);
  return F;
}

/* ════════════════════════ view: rules ════════════════════════ */
/* the explanation of one call: which rules matched, rolled, fired, applied, or lost */
function verdictHtml(r){
  const hang=r.lies.some(l=>l.k==='blackhole'), refs=r.lies.filter(l=>l.k==='error'), thr=r.lies.some(l=>l.k==='throttle');
  const whole=refs.some(l=>!l.part&&(ruleById(l.rule).stage||'before')==='before');
  const truth=hang||whole?'none · the call ended before forwarding':refs.some(l=>l.part&&ruleById(l.rule).stage!=='after')?`ok for the forwarded partitions · ${r.base} ms`:`ok · ${r.base} ms`;
  const delivered=hang?'nothing · the connection stalls':(refs.length?refs.map(l=>l.code+(l.part?' on '+l.part:'')).join(' · ')+(refs.some(l=>l.part)?' · the rest ok':''):'ok')+` · ${r.lat} ms`+(thr?' · throttle_time_ms 2000':'');
  const rows=RULES.filter(ru=>ru.status!=='draft'&&ruleMatches(ru,r)).map(ru=>{
    const lie=r.lies.find(l=>l.rule===ru.id), lost=r.lost.find(l=>l.rule===ru.id), fired=lie||lost;
    if(!fired&&ru.status!=='armed')return '';
    const n=REQS.filter(q=>q.seq<=r.seq&&ruleMatches(ru,q)).length, h=((r.seq*7919+ru.id*104729)%997)/997, p=ru.prob/100;
    const roll=fired?h*p*.98:Math.min(.99,p+(1-p)*h+.01);
    const tc=ru.match.find(f=>f.f==='topic'), tg=tc?r.topics.filter(t=>tc.vals.some(v=>glob(v,t.name))):r.topics;
    const tgt=KIND[ru.fault]!=='refusal'?'the whole call':!r.topics.length?'the whole response':tg.length<r.topics.length?tg.map(t=>`${t.name}[${t.p.join(',')}]`).join(', '):'every partition in the call';
    const stage=(ru.stage||defStage(ru.fault))==='before'?'before forwarding':'after the response';
    const end=lie?`<span class="st ok">Applied · ${stage}</span>`:lost?`<span class="st sh">${lost.st==='shadowed'?'Shadowed':'Pre-empted'} by ${esc(ruleById(lost.by).title)}</span>`:`<span class="st no">did not fire</span>`;
    return `<div class="ex"><div class="nm">${statusIcon(ru.status,12)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ru.title)}</span><span class="sp"></span>${lie?`<span class="fault" style="--c:${FAULT[lie.k].c}">${lie.txt}</span>`:''}</div>
      <div class="steps"><span class="st">Matched · ${tgt}</span><span class="st">Rolled · match #${fmtN(n)} · die ${roll.toFixed(p<.1?3:2)} ${fired?'&lt;':'≥'} ${p.toFixed(2)}</span>${fired?'<span class="st">Fired</span>':''}${end}</div></div>`;
  }).join('');
  return `<div class="vcard"><h5><span class="sdot" style="background:${r.lies.length?'var(--orange)':'var(--green)'}"></span>${r.lies.length?'Lied':'Pass'}<span class="t4" style="font-weight:400">why this call came out this way</span></h5>
    <div class="tv"><span>Truth</span><span class="mono">${truth}</span><span>Delivered</span><span class="mono">${delivered}</span></div>
    ${rows||'<div class="ex note">No armed rule matched this call.</div>'}
    ${r.lies.length>1?'<div class="note">Lies that do not conflict all apply.</div>':''}</div>`;
}

  const arc=(f,t)=>{const [x1,y1]=pt(f),[x2,y2]=pt(t);return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${t-f>180?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`};

  return `<svg width="40" height="40" viewBox="0 0 40 40"><path d="${arc(a0,a0+sw)}" stroke="#25262b" stroke-width="3" fill="none" stroke-linecap="round"/>${frac>0?`<path d="${arc(a0,end)}" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round"/>`:''}<circle cx="20" cy="20" r="10.5" fill="#1b1c20" stroke="rgba(255,255,255,.09)"/><line x1="20" y1="20" x2="${(20+(hx-20)*.6).toFixed(2)}" y2="${(20+(hy-20)*.6).toFixed(2)}" stroke="#e8e9ec" stroke-width="1.7" stroke-linecap="round"/></svg>`;

function parseCmd(s){
  const o={apis:[]}, toks=s.trim().split(/\s+/).filter(Boolean);
  const toMs=t=>{const m=t.match(/^(\d+(?:\.\d+)?)(ms|s|m)$/);return m?Math.round(+m[1]*({ms:1,s:1000,m:60000}[m[2]])):null};
  for(let i=0;i<toks.length;i++){
    const t=toks[i], l=t.toLowerCase(); let x;
    if(/^(delay|slow|lag|latency)$/.test(l))o.fault='delay';
    else if(/^(error|err|fail)$/.test(l))o.fault='error';
    else if(/^(blackhole|hang|timeout|drop)$/.test(l))o.fault='blackhole';
    else if(/^(disconnect|kill|close|reset)$/.test(l))o.fault='disconnect';
    else if(/^(throttle|quota)$/.test(l))o.fault='throttle';
    else if(l==='for'&&toks[i+1]){o.dur=toks[++i]}
    else if(toMs(l)!=null){o.fault==='throttle'?o.thr=toMs(l):o.ms=toMs(l)}
    else if(/^\d+%$/.test(l))o.prob=parseInt(l);
    else if(/^b\d$/.test(l))o.broker=l;
    else if((x=API_NAMES.find(a=>a.toLowerCase()===l||(l.length>=4&&a.toLowerCase().startsWith(l)))))o.apis.push(x);
    else if(l.length>=5&&(x=CODES.find(c=>c[0].toLowerCase().startsWith(l.replace(/-/g,'_')))))o.code=x[0];
    else if(l.length>=3&&(x=CLIENTS.find(c=>c.id.startsWith(l))))o.client=x.id;
    else if(l.includes('*')||TOPICS.includes(l))o.topic=l;
    else if((x=TOPICS.filter(tp=>tp.startsWith(l))).length&&l.length>=3)o.topic=x.length>1?(x.every(tp=>tp.startsWith(l.replace(/\.$/,'')+'.'))?l.replace(/\.$/,'')+'.*':l+'*'):x[0];
    else (o.unk=o.unk||[]).push(t);
  }
  if(o.code&&!o.fault)o.fault='error';
  return o;
}
function renderPalette(stage){
  renderRules(stage);
  const app=stage.firstElementChild;
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="palette"><div class="pal-top"><span class="tag">${ic('zap',11)}Quick inject</span><span class="tag t3">Live rule</span></div>
    <div class="pal-in">${ic('search',16)}<input id="cmd" autocomplete="off" spellcheck="false" placeholder="delay produce orders.* 750ms 40% order-ingest" value="delay produce orders.* 750ms 40% order-ingest"></div>
    <div class="pal-prev" id="pprev"></div><div class="pal-list" id="plist"></div>
    <div class="pal-foot"><span><span class="kbd">↑</span><span class="kbd">↓</span>navigate</span><span><span class="kbd">↵</span>create &amp; arm</span><span><span class="kbd">⇧↵</span>save as draft</span><span><span class="kbd">⇥</span>complete</span><span class="sp"></span><span><span class="kbd">esc</span>close</span></div></div>`;
  app.appendChild(ov);
  const inp=$('#cmd',ov); let items=[], hi=0;
  const defCode=o=>o.code||(o.apis.some(a=>['FindCoordinator','JoinGroup','SyncGroup','Heartbeat','OffsetCommit'].includes(a))?'COORDINATOR_NOT_AVAILABLE':'NOT_LEADER_OR_FOLLOWER');
  function toRule(o,status){
    const m=[];if(o.apis.length)m.push({f:'api',vals:o.apis});if(o.topic)m.push({f:'topic',vals:[o.topic]});if(o.broker)m.push({f:'broker',vals:[o.broker]});
    const f=o.fault||'delay';
    return {id:++RID,title:`${FAULT[f].l} ${o.apis.join(' + ')||(o.broker?'broker '+o.broker.slice(1):'all calls')}${o.topic?' on '+o.topic:''}`,desc:`Live rule from ⌘K: “${inp.value.trim()}”`,scope:o.client||'all',match:m.length?m:[{f:'api',vals:API_NAMES}],fault:f,stage:defStage(f),code:defCode(o),ms:o.ms??500,jitter:0,thr:o.thr??2000,prob:o.prob??100,status,live:true,pad:null,dur:o.dur?o.dur:'Until disarmed'};
  }
  function paint(){
    const o=parseCmd(inp.value), f=o.fault;
    const T=(txt,def,extra='')=>`<span class="tok ${def?'def':''}" ${extra}>${txt}</span>`;
    let h=f?`<span class="fault tok" style="--c:${FAULT[f].c}">${FAULT[f].l}</span>`:T('lie?',1);
    h+=o.apis.length?o.apis.map(a=>apiPill(a)).join(''):o.broker?'':T('any API',1);
    if(o.broker)h+=`<span>on</span>`+T(ic('server',11)+'broker '+o.broker.slice(1));
    h+=`<span>on</span>`+(o.topic?T(ic('topic',11)+esc(o.topic)):T('any topic',1));
    h+=`<span>for</span>`+(o.client?T(`<span class="sdot" style="background:${CL[o.client].color}"></span>${o.client}`):T('all clients',1));
    if(f==='delay')h+=`<span>by</span>`+(o.ms!=null?T(fmtMs(o.ms)):T('500 ms',1));
    if(f==='throttle')h+=`<span>by</span>`+(o.thr!=null?T(fmtMs(o.thr)):T('2 s',1));
    if(f==='error')h+=`<span>with</span>`+T(`<span class="mono">${defCode(o)}</span>`,!o.code);
    h+=`<span>·</span>`+(o.prob!=null?T(o.prob+'%'):T('100%',1))+`<span>·</span>`+(o.dur?T('for '+esc(o.dur)):T('until disarmed',1));
    const sim=toRule(o,'draft');RID--;
    const n=REQS.filter(q=>(sim.scope==='all'||q.client===sim.scope)&&matchAll(q,sim.match)).length;
    h+=`<span class="est">≈ <b>${fmtN(n)}</b> recorded calls match${o.unk?` · <span style="color:var(--orange)">ignored: ${esc(o.unk.join(' '))}</span>`:''}</span>`;
    $('#pprev',ov).innerHTML=h;
    const last=inp.value.endsWith(' ')?'':(inp.value.trim().split(/\s+/).pop()||'').toLowerCase();
    const comp=last.length>=1?[
      ...['delay','error','blackhole','disconnect','throttle'].filter(x=>x.startsWith(last)&&x!==last).map(x=>({t:'fault',v:x,l:FAULT[x].l,d:'lie'})),
      ...API_NAMES.filter(a=>a.toLowerCase().startsWith(last)&&a.toLowerCase()!==last).map(a=>({t:'api',v:a.toLowerCase(),l:apiPill(a),d:'Kafka API'})),
      ...TOPICS.filter(t=>t.startsWith(last)&&t!==last).map(t=>({t:'topic',v:t,l:esc(t),d:'topic · seen in recording'})),
      ...CLIENTS.filter(c=>c.id.startsWith(last)&&c.id!==last).map(c=>({t:'client',v:c.id,l:c.id,d:'client.id · '+c.conns.length+' connections'})),
      ...CODES.filter(c=>last.length>=3&&c[0].toLowerCase().startsWith(last)).map(c=>({t:'code',v:c[0],l:`<span class="mono">${c[0]}</span>`,d:'error '+c[1]})),
    ].slice(0,5):[];
    items=[{a:'create',l:`Create <b class="t1">${esc(sim.title)}</b>`,d:'live rule · '+scopeName(sim.scope),icon:ic('plus'),k:['↵']},...comp.map(c=>({a:'comp',...c,icon:ic('chevr'),k:['⇥']})),...TEMPLATES.map((t,i)=>({a:'tpl',l:t[0],d:t[2],cmd:t[1],icon:ic('spark'),k:[]})),...[['Order producers','selector'],['Slow down order producers','rule'],['Delay 1 s','preset'],['Leader election','preset'],['Leader election','scenario']].map(([l,kind])=>({a:'open',l,kind,icon:ic('hash'),k:[]})),{a:'go',l:'Open pad grid',d:'Pads',v:'pads',icon:ic('grid'),k:[]},{a:'go',l:'Build selector from recorded traffic',d:'Live traffic',v:'record',icon:ic('rec'),k:[]}];
    if(hi>=items.length)hi=0;
    let lastSec='';
    $('#plist',ov).innerHTML=items.map((it,i)=>{const sec={create:'',comp:'Complete',tpl:'Templates',open:'Open',go:'Jump to'}[it.a];const sh=sec&&sec!==lastSec?`<div class="pal-sec">${sec}</div>`:'';lastSec=sec;
      return sh+`<div class="pal-it ${i===hi?'on':''}" data-i="${i}">${it.icon}<span>${it.l}</span><span class="d">${esc(it.d||'')}${it.cmd?` — <span class="mono">${esc(it.cmd)}</span>`:''}</span><span class="r">${it.kind?`<span class="kind">${it.kind}</span>`:''}${it.k.map(k=>`<span class="kbd">${k}</span>`).join('')}</span></div>`}).join('');
  }
  function run(it,shift){
    if(it.a==='create'){const r=toRule(parseCmd(inp.value),shift?'draft':'armed');if(!shift)r.armedAt=++ARM;RULES.push(r);selRule=r.id;toast(`${shift?'Saved draft':'Armed live rule'} <b>${esc(r.title)}</b>`);show(VIEWS.findIndex(v=>v.k==='rules'))}
    else if(it.a==='comp'){const p=inp.value.replace(/\S*$/,'');inp.value=p+it.v+' ';hi=0;paint();inp.focus()}
    else if(it.a==='tpl'){inp.value=it.cmd;hi=0;paint();inp.focus()}
    else if(it.a==='open')toast(`Opens the ${it.kind} <b>${esc(it.l)}</b>. Names are unique per kind, so the list shows the kind.`);
    else if(it.a==='go')show(VIEWS.findIndex(v=>v.k===it.v));
  }
  inp.addEventListener('input',()=>{hi=0;paint()});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){hi=(hi+1)%items.length;paint();e.preventDefault()}
    else if(e.key==='ArrowUp'){hi=(hi-1+items.length)%items.length;paint();e.preventDefault()}
    else if(e.key==='Enter'){run(items[hi],e.shiftKey);e.preventDefault()}
    else if(e.key==='Tab'){const c=items.find(x=>x.a==='comp');if(c)run(c);e.preventDefault()}
    else if(e.key==='Escape'){show(VIEWS.findIndex(v=>v.k==='rules'))}
  });
  ov.addEventListener('click',e=>{const it=e.target.closest('.pal-it');if(it){run(items[+it.dataset.i]);return}if(e.target===ov)show(VIEWS.findIndex(v=>v.k==='rules'))});
  paint(); setTimeout(()=>{inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)},30);
}

/* ════════════════════════ view: scenarios ════════════════════════ */
function renderScenarios(stage){
  stage.innerHTML=`<div class="app">${sidebar('scenarios')}<main class="main">
   <div class="hdr"><div class="crumb">${ic('play',15)}Scenarios</div><span class="t4">·</span><span class="t3" style="font-size:12px">one scenario is active, and the live set sits on top of it</span>
     <span class="sp"></span><button class="btn ghost" id="cap"></button><button class="btn" id="saveLive">Save live set as scenario</button></div>
   <div class="scgrid"><div class="pane" id="sclist"></div><div class="scd" id="scd"></div><div class="lset" id="lset"></div></div></main></div>`;
  const app=stage.firstElementChild; bindSidebar(app);
  const rulesOf=sc=>sc.rules.map(x=>typeof x==='number'?ruleById(x):{title:x});
  function paint(){
    $('#cap',app).innerHTML=capturing?`<span class="sdot" style="background:var(--red)"></span>Stop capture · ${capN} changes`:`<span class="sdot" style="background:var(--t4)"></span>Capture`;
    $('#sclist',app).innerHTML=`<div class="ph">Scenarios<span class="t4">${SCENARIOS.length}</span></div>`+SCENARIOS.map((sc,i)=>`<div class="scrow ${i===selSc?'on':''}" data-sc="${i}"><b>${statusIcon(i===activeSc?'armed':'draft',12)}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(sc.n)}</span></b><div style="display:flex;gap:6px;align-items:center;padding-left:19px;flex-wrap:wrap"><span class="mode" style="--c:${MODE[sc.mode].c}">${MODE[sc.mode].l}</span><span class="t4" style="font-size:11.5px">${sc.steps?sc.steps.length+' steps':sc.rules.length+' rules'} · seed ${sc.seed}</span>${i===activeSc?'<span class="st ok">active</span>':''}${sc.needs?'<span class="kind">fake broker only</span>':''}</div></div>`).join('');
    const sc=SCENARIOS[selSc], act=selSc===activeSc, M=MODE[sc.mode], rs=rulesOf(sc);
    let body='';
    if(sc.steps){
      body=`<h3 class="sch">Scenario rules<span class="t4">armed for the whole run · counters persist across steps</span></h3>`+(rs.map(r=>`<div class="crow" style="grid-template-columns:14px minmax(0,1fr)">${statusIcon(act?'armed':'disarmed',12)}<b>${esc(r.title)}</b></div>`).join('')||'<div class="note">None.</div>')+
        `<h3 class="sch">Steps<span class="t4">within a step, the step's rules come before the scenario's rules</span></h3>`+sc.steps.map((st,i)=>{const cur=act&&i===sc.step,done=act&&i<sc.step;
          return `<div class="step ${cur?'cur':''} ${done?'done':''}"><span class="dot"></span><div><b>${i+1} · ${esc(st.n)}</b><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">${st.arm.length?st.arm.map(a=>`<span class="tag">${ic('zap',11)}${esc(a)}</span>`).join(''):'<span class="t4" style="font-size:11.5px">arms nothing</span>'}</div>${cur&&st.budget?`<div class="bud"><i style="width:${st.budget[0]/st.budget[1]*100}%"></i></div><div class="note" style="margin-top:5px">${st.budget[0]} of ${st.budget[1]} firings applied. The budget is shared by every connection, so there is never a 4th.</div>`:''}</div><span class="t3" style="font-size:12px;white-space:nowrap">${st.until?'until '+esc(st.until):'until deactivated'}</span></div>`}).join('');
    }else if(sc.mode==='chain'){
      body=`<h3 class="sch">Rules in order<span class="t4">every rule that fires applies · order only decides between rules that conflict</span></h3>`+rs.map((r,i)=>{
        const above=r.id?rs.slice(0,i).filter(a=>a.id&&conflicts(a,r)):[], eff=r.id?r.prob*above.reduce((p,a)=>p*(1-a.prob/100),1):0;
        return `<div class="crow"><span class="mono t4">${i+1}</span><span class="t4">${ic('drag',12)}</span><b>${esc(r.title)}</b>${r.id?faultBadge(r):`<span class="tag">${i?'lie · topology':'event · leader moves'}</span>`}<span class="eff">${r.id?(above.length?`<s>${r.prob}%</s> → ${eff.toFixed(1)}% effective`:r.prob+'%'):''}</span></div>`+
          (above.length?`<div class="note" style="padding:4px 10px 2px 56px">Conflicts with <b>${esc(above[0].title)}</b> above. Both fail the call, so this rule only applies when that one did not fire.</div>`:'')}).join('');
    }else{
      body=`<h3 class="sch">Rules<span class="t4">a conflict goes to the rule armed most recently</span></h3>`+rs.map(r=>`<div class="crow" style="grid-template-columns:14px minmax(0,1fr)">${statusIcon('disarmed',12)}<b>${esc(r.title)}</b></div>`).join('')+`<div class="note" style="margin-top:8px">Activating arms the rules in this order, so the last one counts as armed most recently. Live mode follows the person at the controls. It is not meant to be reproducible.</div>`;
    }
    $('#scd',app).innerHTML=`<div style="display:flex;align-items:center;gap:8px"><span class="mode" style="--c:${M.c}">${M.l}</span><span class="t4 mono">scenarios/${sc.n.toLowerCase().replace(/[^a-z0-9]+/g,'-')}.yaml</span><span class="sp"></span>${sc.steps&&act?`<button class="btn" id="stepB">Step ${ic('chevr',12)}</button>`:''}${act?'<span class="st ok">active</span>':`<button class="btn primary" id="actB" ${sc.needs&&ENV==='proxy'?'disabled style="opacity:.4;cursor:default"':''}>Activate</button>`}</div>
      <h2 style="margin-top:12px">${esc(sc.n)}</h2><p class="t3" style="font-size:12.5px;margin-bottom:8px">${esc(sc.desc||'')}</p>
      <div class="stats"><span>seed <b>${sc.seed}</b></span><span>a conflict goes to <b>${sc.mode==='live'?'the rule armed most recently':'the rule listed first'}</b></span></div>
      ${sc.needs&&ENV==='proxy'?`<div class="ccard" style="margin-top:12px"><span class="t2">Needs the event “${sc.needs}”.</span><span class="note">The proxy does not emulate it. Run this scenario on the fake broker, or use the <b>Leader flap</b> preset: a refusal with NOT_LEADER_OR_FOLLOWER and truthful Metadata.</span></div>`:sc.needs?`<div class="note" style="margin-top:10px">Uses the event “${sc.needs}”. On the fake broker the World applies it for real.</div>`:''}
      ${body}`;
    const ls=liveSet();
    $('#lset',app).innerHTML=`<div class="t1" style="font-weight:500;display:flex;align-items:center;gap:8px">Live set<span class="t4" style="font-weight:400">${ls.length}</span></div><div class="note" style="margin-top:4px">Rules armed by hand. They win conflicts with the scenario. Among themselves, the most recently armed rule wins.</div>`+
      ls.map((r,i)=>`<div class="lrule"><div style="display:flex;gap:8px;align-items:center;min-width:0">${statusIcon('armed',12)}<b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}</b><span class="sp"></span>${i===0?'<span class="kind">latest</span>':''}</div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${faultBadge(r)}<span class="mono t3">${r.prob}%</span><span class="sp"></span>${r.live?`<button class="btn ghost" data-keep="${r.id}" style="height:22px">Keep</button>`:'<span class="src">workspace</span>'}<span class="sw on" data-tog="${r.id}"></span></div></div>`).join('')+
      (ls.length?'':'<div class="note" style="margin-top:12px">Nothing is armed by hand. Press a pad or use ⌘K.</div>')+
      `<div class="note" style="margin-top:14px">Live rules stay in memory. <b>Keep</b> saves one to the workspace. <b>Save live set as scenario</b> writes a Chain scenario with the most recently armed rule first.</div>`;
  }
  paint();
  app.addEventListener('click',e=>{
    const row=e.target.closest('[data-sc]'); if(row){selSc=+row.dataset.sc;paint();return}
    const tg=e.target.closest('[data-tog]'); if(tg){arm(ruleById(+tg.dataset.tog));if(capturing)capN++;paint();return}
    const kp=e.target.closest('[data-keep]'); if(kp){const r=ruleById(+kp.dataset.keep);r.live=false;r.file='rules/kept.yaml';toast(`Kept <b>${esc(r.title)}</b> as a workspace rule`);paint();return}
    const sc=SCENARIOS[selSc];
    if(e.target.closest('#actB')&&!(sc.needs&&ENV==='proxy')){SCENARIOS[activeSc].rules.forEach(x=>typeof x==='number'&&arm(ruleById(x),false));activeSc=selSc;sc.rules.forEach(x=>typeof x==='number'&&arm(ruleById(x),true));if(sc.steps)sc.step=0;toast(`Activated <b>${esc(sc.n)}</b> · ${MODE[sc.mode].l}`);show(cur);return}
    if(e.target.closest('#stepB')){if(sc.step<sc.steps.length-1){sc.step++;toast(`Step ${sc.step+1} · <b>${esc(sc.steps[sc.step].n)}</b> <span class="t4">— the rules of the previous step disarmed</span>`)}paint();return}
    if(e.target.closest('#cap')){capturing=!capturing;if(!capturing){SCENARIOS.push({n:'Captured '+fmtT(clock).slice(0,5),mode:'sequence',seed:1337,rules:[],step:0,desc:'Captured from the live set. One step per change, ending on the time between changes.',steps:Array.from({length:Math.max(1,capN)},(_,i)=>({n:'Change '+(i+1),arm:liveSet().slice(0,2).map(x=>x.title),until:'after '+(3+i*4)+' s'}))});toast(`Captured ${capN} changes as a Sequence scenario`);capN=0}paint();return}
    if(e.target.closest('#saveLive')){const ls=liveSet();SCENARIOS.push({n:'Live set '+fmtT(clock).slice(0,5),mode:'chain',seed:1337,rules:ls.map(x=>x.id),desc:'Saved from the live set, most recently armed first.'});ls.forEach(x=>{x.live=false;x.file='rules/kept.yaml'});toast(`Saved ${ls.length} rules as a Chain scenario, most recently armed first`);paint()}
  });
}

function renderWorld(stage){
  stage.innerHTML=`<div class="app">${sidebar('world')}<main class="main">
   <div class="hdr"><div class="crumb">${ic('globe',15)}World</div><span class="t4">·</span><span class="t3" style="font-size:12px"><span class="mono">${WORLD.name}</span> · the truth on the fake broker</span>
     <span class="sp"></span><span class="t4" style="font-size:12px">virtual clock</span><span class="mono t1" id="wclock"></span>
     <div class="seg" id="wspeed">${[[0,'Pause'],[1,'×1'],[10,'×10'],[60,'×60']].map(([v,l])=>`<button class="${WORLD.speed===v?'on':''}" data-speed="${v}">${l}</button>`).join('')}</div>
     <button class="btn ghost" id="wstep">Step +30 s</button>
     <button class="btn ghost" id="wseed">${ic('rec')}Seed from recording</button><button class="btn" id="wsave">Save world</button></div>
   <div class="wgrid"><div class="pane" id="wleft"></div><div class="pane" id="wtopics"></div><div class="pane" id="wright"></div></div></main></div>`;
  const app=stage.firstElementChild; bindSidebar(app);
  const red=t=>`<span style="color:var(--red)">${t}</span>`;
  const paintClock=()=>{$('#wclock',app).textContent=fmtT(WORLD.clock).slice(0,8)};
  function paintLeft(){
    $('#wleft',app).innerHTML=`<div class="ph">Brokers<span class="t4">${BROKERS.length}</span></div><div class="wcol">`+BROKERS.map(b=>`<div class="bcard"><div style="display:flex;align-items:center;gap:8px"><span class="t1" style="font-weight:500">Broker ${b.id}</span><span class="sp"></span><span class="t4" style="font-size:11.5px">leads ${WORLD.topics.reduce((a,tp)=>a+tp.parts.filter(p=>p.leader===b.id).length,0)} partitions</span></div><div class="seg">${['live','unresponsive','down'].map(st=>`<button class="${b.state===st?'on':''}" data-wbs="${b.id}:${st}" style="${b.state===st&&st!=='live'?`color:${st==='down'?'var(--red)':'var(--orange)'}`:''}">${st[0].toUpperCase()+st.slice(1)}</button>`).join('')}</div></div>`).join('')+
      `<div class="note" id="wfo" style="display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--t2)"><span class="cb" style="flex:none;${WORLD.failover?'background:var(--accent2);border-color:var(--accent2)':''}">${WORLD.failover?ic('check',10):''}</span>Going down moves leaders and coordinators</div>
       <div class="note">Without failover, a broker that goes down leaves its partitions leaderless. The World does not react to an event by itself. A broker that comes back is a replica again, and leaders stay where they are.</div></div>
      <div class="ph" style="position:static">Generators<span class="t4">${WORLD.gens.length}</span></div><div class="wcol">`+WORLD.gens.map((g,i)=>`<div class="bcard"><div style="display:flex;align-items:center;gap:8px"><span class="t1" style="font-weight:500">${g.topic}</span><span class="sp"></span><span class="sw ${g.on?'on':''}" data-wgen="${i}"></span></div><span class="mono t3">${g.rate}/s · key ${g.key}</span></div>`).join('')+`<div class="note">Generators append records on the virtual clock, so consumers have something to read without a producer.</div></div>`;
  }
  function paintTopics(){
    $('#wtopics',app).innerHTML=`<div class="prow h"><span>Partition</span><span>Leader</span><span>Epoch</span><span>In sync</span><span>Log start</span><span>High watermark</span><span></span></div>`+WORLD.topics.map((tp,ti)=>{const g=WORLD.gens.find(x=>x.topic===tp.n&&x.on);
      return `<div class="lgrp" style="top:32px">${ic('topic',13)}${tp.n}<span class="t4">${tp.parts.length} partitions</span>${g?`<span class="tag">${g.rate}/s generated</span>`:''}<span class="sp"></span><button class="ib" data-tev="${ti}" title="Topic events">${ic('more')}</button></div>`+
        tp.parts.map(p=>`<div class="prow"><span class="mono">${tp.n}/${p.i}</span><span>${p.leader?'broker '+p.leader:red('none')}</span><span class="mono t3">${p.epoch}</span><span class="mono t3">${p.isr.filter(id=>BROKERS[id-1].state!=='down').join(' ')||'—'}</span><span class="mono t3">${fmtN(p.start)}</span><span class="mono" data-hw="${ti}:${p.i}">${fmtN(Math.floor(p.hw))}</span><button class="ib" data-pev="${ti}:${p.i}" title="Partition events">${ic('zap',13)}</button></div>`).join('')}).join('');
  }
  function paintRight(){
    $('#wright',app).innerHTML=`<div class="ph">Consumer groups<span class="t4">${WORLD.groups.length}</span></div><div class="wcol">`+WORLD.groups.map((g,i)=>`<div class="bcard"><div style="display:flex;align-items:center;gap:8px"><span class="t1" style="font-weight:500">${g.n}</span><span class="sp"></span><span class="kind">${g.proto} protocol</span></div><span class="mono t3">${g.proto==='classic'?'generation':'group epoch'} ${g.epoch} · ${g.members} members · coordinator ${g.coord?'broker '+g.coord:red('none')}</span><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-gev="${i}:rebalance">Rebalance</button><button class="btn" data-gev="${i}:coord">Coordinator moves</button><button class="btn ghost" data-gev="${i}:reset">Reset offsets</button></div></div>`).join('')+`</div>
      <div class="ph" style="position:static">Events<span class="t4">newest first</span></div><div class="wcol" style="gap:0">${WORLD.log.map(l=>`<div class="wlog"><span class="t4">${fmtT(l.t).slice(0,8)}</span><span>${esc(l.txt)}</span></div>`).join('')||'<div class="note">No events yet. Use the buttons here, or let a rule fire one. Events are the only way the World changes, apart from the clients\' own calls.</div>'}</div>`;
  }
  const paint=()=>{paintClock();paintLeft();paintTopics();paintRight()};
  function tick(ms){
    WORLD.clock+=ms;
    for(const g of WORLD.gens){const tp=g.on&&WORLD.topics.find(x=>x.n===g.topic);if(!tp)continue;const ps=tp.parts.filter(p=>p.leader);ps.forEach(p=>p.hw+=g.rate*ms/1000/ps.length)}
    paintClock();$$('[data-hw]',app).forEach(el=>{const [ti,pi]=el.dataset.hw.split(':');const p=WORLD.topics[ti]&&WORLD.topics[ti].parts[pi];if(p)el.textContent=fmtN(Math.floor(p.hw))});
  }
  paint();
  app.addEventListener('click',e=>{
    const sp=e.target.closest('[data-speed]'); if(sp){WORLD.speed=+sp.dataset.speed;$$('#wspeed button',app).forEach(b=>b.classList.toggle('on',b===sp));return}
    if(e.target.closest('#wstep')){tick(30000);toast('Stepped the virtual clock by 30 s');return}
    if(e.target.closest('#wsave')){toast(`Saved the World as <b>worlds/${WORLD.name}.yaml</b>`);return}
    if(e.target.closest('#wseed')){toast(`Seeded from the recording: ${WORLD.topics.length} topics, ${WORLD.groups.length} groups and 1 transactional id`);return}
    if(e.target.closest('#wfo')){WORLD.failover=!WORLD.failover;paintLeft();return}
    const bs=e.target.closest('[data-wbs]'); if(bs){const [id,st]=bs.dataset.wbs.split(':');setBroker(+id,st,WORLD.failover);paint();return}
    const gn=e.target.closest('[data-wgen]'); if(gn){const g=WORLD.gens[+gn.dataset.wgen];g.on=!g.on;paint();return}
    const ge=e.target.closest('[data-gev]'); if(ge){const [i,k]=ge.dataset.gev.split(':'),g=WORLD.groups[+i];
      if(k==='rebalance'){g.epoch++;wlog(`rebalance · ${g.n} → ${g.proto==='classic'?'generation':'group epoch'} ${g.epoch}`)}
      else if(k==='coord'){const c=liveBrokers().filter(id=>id!==g.coord);if(c.length){g.coord=c[0];wlog(`coordinator moves · ${g.n} → broker ${g.coord}`)}}
      else wlog(`committed offset reset · ${g.n} on orders.eu → earliest`);
      paint();return}
    const pe=e.target.closest('[data-pev]'); if(pe){const [ti,pi]=pe.dataset.pev.split(':').map(Number),tp=WORLD.topics[ti],p=tp.parts[pi];
      menu(pe,[{sec:`Event on ${tp.n}/${p.i}`},{label:'Leader moves',d:'new leader, new epoch',k:'lead'},{label:'Records expired',d:'log start moves forward',k:'exp'},{label:'Log truncated',d:'end offset moves back',k:'trunc'}],it=>{
        if(it.k==='lead')moveLeader(tp,p);
        else if(it.k==='exp'){p.start=Math.max(p.start,Math.floor(p.hw)-2000);wlog(`records expired · ${tp.n}/${p.i} log start → ${fmtN(p.start)}`)}
        else{p.hw=Math.max(p.start,p.hw-500);p.epoch++;wlog(`log truncated · ${tp.n}/${p.i} end → ${fmtN(Math.floor(p.hw))}`)}
        paint()});return}
    const te=e.target.closest('[data-tev]'); if(te){const ti=+te.dataset.tev,tp=WORLD.topics[ti];
      menu(te,[{sec:`Event on ${tp.n}`},{label:'Partition added',k:'add'},{label:'Topic deleted',k:'del'}],it=>{
        if(it.k==='add'){const i=tp.parts.length;tp.parts.push({i,leader:liveBrokers()[0]||null,epoch:0,isr:[1,2,3],start:0,hw:0});wlog(`partition added · ${tp.n}/${i}`)}
        else{WORLD.topics.splice(ti,1);wlog(`topic deleted · ${tp.n}`)}
        paint()});return}
  });
  timers.push(setInterval(()=>{if(WORLD.speed)tick(500*WORLD.speed)},500));
}

/* ════════════════════════ mockup switcher ════════════════════════ */
const VIEWS=[
 {k:'record',name:'Record',desc:'Live traffic per connection with an auto-built index. Click anything to filter, then save as selector or inject. Lies that do not conflict show up together on one call.',render:s=>renderRecord(s,'live')},
 {k:'selector',name:'Selector from call',desc:'Click a recorded call. Its verdict is explained per rule: matched, rolled, fired, applied, shadowed or pre-empted. Then tick fields to build a selector.',render:s=>renderRecord(s,'select')},
 {k:'rules',name:'Rules',desc:'Rules by name, grouped by scope. The inspector sets lie, stage, trigger, counter and lifetime. Live rules stay in memory until kept.',render:renderRules},
 {k:'pads',name:'Pads',desc:'Rows = selectors, columns = presets, bottom row = layer. Pads arm live rules, and every encoder maps to a real rule parameter.',render:renderPads},
 {k:'clients',name:'Clients',desc:'One column per scope. Drag rules between columns to re-scope them. Broker states are events, emulated on the proxy.',render:renderClients},
 {k:'scenarios',name:'Scenarios',desc:'Live, Chain and Sequence scenarios with the live set on top: effective probabilities, steps with exact budgets, capture.',render:renderScenarios},
 {k:'world',name:'World',desc:'Only with the fake broker. Brokers, topics, partitions, groups and generators on a virtual clock. Events really happen here. Switch environment in the sidebar footer.',render:s=>{if(ENV!=='fake'){setEnv('fake');toast('Switched to the fake broker. The World view only exists there. Switch back in the sidebar footer.')}renderWorld(s)}},
 {k:'palette',name:'Quick inject ⌘K',desc:'Type a sentence, get a live rule: “delay produce orders.* 750ms 40% order-ingest”. Kinds are labelled where names mix.',render:renderPalette},
];
let cur=0, timers=[];
function show(i){
  if(i<0)i=0; timers.forEach(clearInterval); timers=[]; padKeys=null; $$('.menu').forEach(m=>m.remove());
  cur=i; $$('#mtabs button').forEach((b,j)=>b.classList.toggle('on',j===i)); $('#mdesc').textContent=VIEWS[i].desc;
  VIEWS[i].render($('#stage')); history.replaceState(null,'','#'+VIEWS[i].k);
}
$('#mtabs').innerHTML=VIEWS.map((v,i)=>`<button data-v="${i}"><span class="n">${i+1}</span>${v.name}</button>`).join('');
$('#mtabs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)show(+b.dataset.v)});
document.addEventListener('keydown',e=>{
  const typing=e.target.closest('input,[contenteditable]');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();show(VIEWS.findIndex(v=>v.k==='palette'));return}
  if(typing)return;
  if(VIEWS[cur].k==='pads'&&/^[1-5]$/.test(e.key)){pScope=PSCOPES[+e.key-1].id;show(cur);return}
  if(padKeys&&padKeys(e))return;
  if(/^[1-8]$/.test(e.key)){show(+e.key-1);return}
  if(e.key.toLowerCase()==='r'&&!e.metaKey){recording=!recording;if(recording)recStart=Date.now();show(cur)}
  if(e.key.toLowerCase()==='c'&&VIEWS[cur].k==='rules'){$('#newRule')?.click();e.preventDefault()}
});
setInterval(()=>$$('[data-elapsed]').forEach(el=>{if(recording)el.textContent=elapsed()}),1000);
show(Math.max(0,VIEWS.findIndex(v=>'#'+v.k===location.hash)));
</script>
