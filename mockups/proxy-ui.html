<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GaslightMQ Proxy — UI mockups</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
:root{
  --bg:#08090a; --bg2:#0c0d0f; --panel:#0f1012; --surface:#16171a; --surface2:#1c1d21; --surface3:#24252a;
  --hover:rgba(255,255,255,.035); --sel:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.065); --border2:rgba(255,255,255,.1); --border3:rgba(255,255,255,.17);
  --t1:#f7f8f8; --t2:#d0d6e0; --t3:#8a8f98; --t4:#62666d; --t5:#3e4147;
  --accent:#7170ff; --accent2:#5e6ad2;
  --red:#eb5757; --orange:#f2994a; --violet:#a78bfa; --blue:#4ea7fc; --green:#4cb782; --yellow:#f2c94c; --teal:#2dd4bf;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--t2);font:13px/1.45 "Inter var",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv01","cv11","ss03";overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
.i{flex:none;display:block}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:0}
.t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t5{color:var(--t5)}
.sp{flex:1}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#26272b;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-corner{background:transparent}

/* ── mockup switcher (not part of the design) ── */
.mbar{height:46px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid #161616;background:#000}
.mbar .brand{font-weight:600;color:var(--t1);font-size:12.5px;white-space:nowrap}
.mbar .brand small{color:var(--t4);font-weight:500;margin-left:6px}
.mtabs{display:flex;gap:2px;background:#0d0d0e;border:1px solid #1d1d1f;border-radius:8px;padding:2px}
.mtabs button{height:28px;padding:0 10px;border-radius:6px;color:var(--t3);font-size:12.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.mtabs button:hover{color:var(--t1)}
.mtabs button.on{background:#1f2023;color:var(--t1)}
.mtabs .n{font:500 10.5px var(--mono);color:var(--t4)}
.mdesc{color:var(--t3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#stage{height:calc(100vh - 46px);padding:8px}

/* ── app shell ── */
.app{height:100%;display:grid;grid-template-columns:226px minmax(0,1fr);background:var(--bg);border:1px solid #17181a;border-radius:10px;overflow:hidden;position:relative}
.side{display:flex;flex-direction:column;padding:10px 8px;min-height:0;overflow:auto}
.ws{display:flex;align-items:center;gap:8px;padding:2px 4px 2px 6px;height:32px}
.logo{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#7170ff,#c084fc 55%,#f2994a);flex:none}
.ws b{color:var(--t1);font-weight:600;font-size:13px}
.ib{width:26px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--t3);flex:none}
.ib:hover{background:var(--hover);color:var(--t1)}
.recbtn{margin:8px 2px 12px;height:30px;border-radius:7px;border:1px solid var(--border2);background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--t2);font-size:12.5px;font-weight:500}
.recbtn:hover{background:var(--surface2)}
.recbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--t4)}
.recbtn.on .dot{background:var(--red);box-shadow:0 0 0 3px rgba(235,87,87,.2);animation:pulse 1.6s infinite}
.recbtn .mono{margin-left:auto;color:var(--t3)}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(235,87,87,.04)}}
.nav{display:flex;align-items:center;gap:9px;height:28px;padding:0 8px;border-radius:6px;color:var(--t2);cursor:pointer;white-space:nowrap}
.nav:hover{background:var(--hover)}
.nav.on{background:var(--sel);color:var(--t1)}
.nav .i{color:var(--t3)} .nav.on .i{color:var(--t1)}
.nav .cnt{margin-left:auto;font-size:11.5px;color:var(--t4)}
.sec{font-size:11.5px;font-weight:500;color:var(--t4);padding:16px 8px 5px;display:flex;align-items:center;gap:6px}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.sfoot{margin-top:auto;padding:14px 2px 2px;display:flex;flex-direction:column;gap:8px}
.hw{border:1px solid var(--border);border-radius:8px;padding:9px 10px;background:var(--bg2);display:flex;gap:10px;align-items:center;cursor:pointer}
.hw:hover{border-color:var(--border2)}
.mini{display:grid;grid-template-columns:repeat(8,4px);gap:2px;flex:none}
.mini i{width:4px;height:4px;border-radius:1px;background:#25262b}
.addr{display:flex;align-items:center;gap:7px;font:11px var(--mono);color:var(--t4);padding:0 8px}
.addr i{width:6px;height:6px;border-radius:50%;background:var(--green)}

.main{margin:8px 8px 8px 0;background:var(--panel);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.hdr{height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-bottom:1px solid var(--border)}
.crumb{display:flex;align-items:center;gap:7px;color:var(--t1);font-weight:500;white-space:nowrap}
.crumb .i{color:var(--t3)}
.btn{height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--border2);background:var(--surface);color:var(--t2);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.btn:hover{background:var(--surface2);color:var(--t1)}
.btn.primary{background:var(--accent2);border-color:rgba(255,255,255,.1);color:#fff}
.btn.primary:hover{background:#6973e3}
.btn.ghost{border-color:transparent;background:transparent;color:var(--t3)}
.btn.ghost:hover{background:var(--hover);color:var(--t1)}
.btn .kbd{margin-left:2px}
.btn.primary .kbd{color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.25)}
.kbd{font:500 10.5px var(--mono);color:var(--t3);border:1px solid var(--border2);border-radius:4px;padding:0 4px;height:17px;display:inline-flex;align-items:center;background:rgba(255,255,255,.02)}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px;flex:none}
.seg button{height:22px;padding:0 9px;border-radius:5px;font-size:12px;color:var(--t3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--t1)}
.seg button.on{background:var(--surface3);color:var(--t1);box-shadow:0 0 0 1px var(--border) inset}
.seg.f button.on{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent) inset}
.tab{height:26px;padding:0 10px;border-radius:6px;font-size:12.5px;color:var(--t3);border:1px solid transparent;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--t1)}
.tab.on{color:var(--t1);border-color:var(--border2);background:var(--surface)}
.tab .t4{font-size:11.5px}

.api{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px 0 6px;border-radius:5px;border:1px solid var(--border);background:rgba(255,255,255,.025);font-size:11.5px;color:var(--t2);white-space:nowrap;font-weight:500;flex:none}
.api i{width:6px;height:6px;border-radius:2px;background:var(--c)}
.api .v{color:var(--t4);font-weight:400;font-family:var(--mono);font-size:10.5px}
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;background:rgba(255,255,255,.045);font-size:11.5px;color:var(--t2);white-space:nowrap;flex:none}
.tag .i{color:var(--t4)}
.fault{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap;flex:none}
.fault b{font-weight:500;color:var(--t2)}
.fault::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}

.chip{display:inline-flex;align-items:stretch;height:24px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);font-size:12px;overflow:hidden;flex:none}
.chip > span{display:flex;align-items:center;padding:0 7px;border-right:1px solid var(--border);white-space:nowrap}
.chip .f{color:var(--t2);gap:6px}
.chip .f .i{color:var(--t4)}
.chip .o{color:var(--t4)}
.chip .v{color:var(--t1)}
.chip .x{padding:0 5px;color:var(--t4);border-right:0;cursor:pointer}
.chip .x:hover{color:var(--t1);background:var(--hover)}
.chip > span:last-child{border-right:0}

.menu{position:fixed;z-index:60;min-width:220px;background:#1b1c20;border:1px solid var(--border2);border-radius:9px;box-shadow:0 16px 40px rgba(0,0,0,.55);padding:4px;animation:tin .12s ease-out}
.menu .mi{display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;border-radius:6px;color:var(--t2);font-size:12.5px;cursor:pointer}
.menu .mi:hover{background:rgba(255,255,255,.06);color:var(--t1)}
.menu .mi .d{margin-left:auto;color:var(--t4);font-size:11.5px}
.menu .ms{font-size:11px;color:var(--t4);padding:6px 9px 3px}
#toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:100}
.toast{background:#1c1d21;border:1px solid var(--border2);border-radius:9px;padding:10px 14px;color:var(--t1);font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;animation:tin .2s ease-out;max-width:420px}
.toast .i{color:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

/* ── record ── */
.fbar{min-height:42px;flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.fbar .hint{color:var(--t4);font-size:12px}
.rgrid{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(0,1fr) 292px}
.rgrid.sel{grid-template-columns:232px minmax(0,1fr) 430px}
.pane{min-height:0;overflow:auto;border-right:1px solid var(--border);position:relative}
.pane:last-child{border-right:0}
.ph{position:sticky;top:0;z-index:3;background:var(--panel);height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12px;color:var(--t3);font-weight:500;border-bottom:1px solid var(--border);white-space:nowrap}
.ph .t4{font-weight:400}
.tree .cl{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 14px;color:var(--t1);cursor:pointer;font-weight:500;margin-top:4px}
.tree .cl .mono{margin-left:auto;color:var(--t4);font-weight:400;font-size:11px}
.tree .sub{font:10.5px var(--mono);color:var(--t4);padding:0 14px 4px 30px;margin-top:-6px}
.tree .cl:hover,.tree .cn:hover{background:var(--hover)}
.tree .cn{display:grid;grid-template-columns:28px 1fr auto 36px;align-items:center;gap:6px;height:25px;padding:0 12px 0 30px;cursor:pointer;color:var(--t3);font-size:12px}
.tree .cn .mono{font-size:11px}
.tree .cn .n{text-align:right;color:var(--t4);font:11px var(--mono)}
.tree .on{background:rgba(113,112,255,.09)!important}
.act{display:flex;gap:1px;align-items:flex-end;height:12px}
.act i{width:2px;background:#33353b;border-radius:1px}
.srow{display:grid;grid-template-columns:84px 150px 24px 170px minmax(0,1fr) 92px 196px;align-items:center;gap:10px;height:32px;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.03);font-size:12px;cursor:pointer;position:relative}
.srow:hover{background:var(--hover)}
.srow.new{animation:flash 1.4s ease-out}
@keyframes flash{from{background:rgba(113,112,255,.13)}to{background:transparent}}
.srow.m::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:rgba(113,112,255,.7)}
.srow.dim{opacity:.38}
.srow.selected{background:rgba(113,112,255,.12)!important;box-shadow:inset 2px 0 0 var(--accent)}
.thead{position:sticky;top:0;z-index:2;background:var(--panel);height:32px;border-bottom:1px solid var(--border);color:var(--t4);font-size:11.5px;cursor:default}
.thead:hover{background:var(--panel)}
.who{display:flex;align-items:center;gap:7px;min-width:0;color:var(--t2)}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .mono{color:var(--t4);flex:none}
.det{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap;color:var(--t3)}
.det .tp{color:var(--t2)}
.det .pp{color:var(--t4);font-family:var(--mono);font-size:10.5px}
[data-ff]{cursor:pointer}
.det [data-ff]:hover,.who[data-ff]:hover span{color:var(--t1);text-decoration:underline;text-decoration-color:var(--t4);text-underline-offset:3px}
.lat{display:flex;align-items:center;gap:7px;justify-content:flex-end;font-family:var(--mono);font-size:11px;color:var(--t3)}
.lat i{height:3px;border-radius:2px;background:#3a3c42;display:block}
.out{display:flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;overflow:hidden}
.out .ok{color:var(--t5);font-family:var(--mono);font-size:11px}
.out .r{color:var(--t4);font-family:var(--mono);font-size:10.5px}
.newpill{position:sticky;top:40px;z-index:4;margin:0 auto -26px;width:max-content;display:none;height:26px;padding:0 10px;border-radius:13px;background:var(--accent2);color:#fff;font-size:12px;font-weight:500;align-items:center;gap:6px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.newpill.show{display:flex}
.facet{padding:12px 14px 8px;border-bottom:1px solid var(--border)}
.facet h4{font-size:12px;font-weight:500;color:var(--t2);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.facet h4 .t4{font-weight:400}
.fv{position:relative;display:flex;align-items:center;gap:8px;height:24px;padding:0 6px;margin:0 -6px;border-radius:5px;font-size:12px;color:var(--t2)}
.fv:hover{background:var(--hover)}
.fv .bar{position:absolute;left:0;top:3px;bottom:3px;border-radius:4px;background:rgba(255,255,255,.04);z-index:0}
.fv > *{position:relative;z-index:1}
.fv .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv .c{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--t4)}
.fv.on{color:var(--t1)}
.fv.on .bar{background:rgba(113,112,255,.2)}
.fv .ck{width:12px;height:12px;border-radius:3px;border:1px solid var(--border3);display:grid;place-items:center;flex:none;color:#fff}
.fv.on .ck{background:var(--accent2);border-color:var(--accent2)}
.fv.pat .nm{color:#b4b3ff;font-family:var(--mono);font-size:11.5px}
.ixnote{padding:10px 14px;font-size:11.5px;color:var(--t4);line-height:1.5;border-bottom:1px solid var(--border)}

/* selector sheet */
.sheet{background:var(--bg2)}
.sh-h{padding:14px 16px 12px;border-bottom:1px solid var(--border)}
.fgrp{font-size:11px;color:var(--t4);padding:12px 16px 4px;font-weight:500;display:flex;gap:6px}
.fld{display:grid;grid-template-columns:14px minmax(0,1fr) auto;align-items:center;gap:10px;min-height:30px;padding:2px 16px;cursor:pointer}
.fld:hover{background:var(--hover)}
.fld .k{font-family:var(--mono);font-size:11.5px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld .val{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--t2)}
.fld.on .k{color:var(--t1)}
.fld.info{cursor:default}
.fld.info .k{color:var(--t4)}
.fld.info .val{color:var(--t4)}
.cb{width:14px;height:14px;border-radius:4px;border:1px solid var(--border3);display:grid;place-items:center;color:#fff}
.fld.on .cb{background:var(--accent2);border-color:var(--accent2)}
.gen{font-family:var(--mono);font-size:11px;height:20px;padding:0 6px;border-radius:4px;border:1px dashed var(--border3);color:var(--t3)}
.gen:hover{color:var(--t1)}
.gen.on{border-style:solid;border-color:rgba(113,112,255,.6);color:#c4c3ff;background:rgba(113,112,255,.12)}
.mcard{margin:14px 16px 12px;border:1px solid var(--border2);border-radius:10px;background:var(--surface);padding:14px}
.big{font-size:26px;font-weight:600;color:var(--t1);letter-spacing:-.02em;line-height:1.1}
.big span{font-size:12.5px;font-weight:400;color:var(--t3);letter-spacing:0;margin-left:4px}
.bd{display:grid;grid-template-columns:104px 1fr 42px;gap:10px;align-items:center;font-size:12px;height:22px;color:var(--t2)}
.bd .b{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden}
.bd .b i{display:block;height:100%;border-radius:3px}
.bd .n{text-align:right;font:11px var(--mono);color:var(--t4)}
.selx{font-family:var(--mono);font-size:11.5px;line-height:1.75;color:var(--t2);background:#08090a;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:0 16px;white-space:pre}
.selx .k{color:#b4b3ff} .selx .s{color:#8fd6a8} .selx .c{color:var(--t4)}

/* ── rules ── */
.lgrp{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 16px;background:#121316;border-bottom:1px solid var(--border);color:var(--t1);font-weight:500;font-size:12.5px;position:sticky;top:0;z-index:1}
.lgrp .t4{font-weight:400;font-size:12px}
.rrow{display:grid;grid-template-columns:16px 56px minmax(0,1fr) auto 38px 64px 30px 30px;align-items:center;gap:12px;height:40px;padding:0 16px 0 24px;border-bottom:1px solid rgba(255,255,255,.035);cursor:pointer}
.rrow:hover{background:var(--hover)}
.rrow.on{background:var(--sel)}
.rrow .ttl{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden}
.rrow .ttl b{font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:60px}
.rrow.off .ttl b{color:var(--t3)}
.padref{font:500 10.5px var(--mono);color:var(--t3);border:1px solid var(--border2);border-radius:4px;height:18px;display:grid;place-items:center}
.sw{width:26px;height:15px;border-radius:10px;background:var(--surface3);position:relative;transition:.15s;border:1px solid var(--border);cursor:pointer}
.sw::after{content:"";position:absolute;top:1px;left:1px;width:11px;height:11px;border-radius:50%;background:#8d9198;transition:.15s}
.sw.on{background:var(--accent2)}
.sw.on::after{left:12px;background:#fff}
.insp{border-left:1px solid var(--border);overflow:auto;min-height:0}
.insp-in{padding:16px 20px 30px}
.insp h2{font-size:18px;font-weight:600;color:var(--t1);letter-spacing:-.015em;margin:10px 0 4px;outline:0}
.insp p.d{color:var(--t3);font-size:12.5px;margin-bottom:16px}
.prop{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;align-items:start;min-height:32px;padding:2px 0}
.prop > label{color:var(--t3);font-size:12.5px;padding-top:6px}
.prop .pv{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px}
.pv.col{flex-direction:column;align-items:flex-start}
.slider{position:relative;height:28px;flex:1;cursor:ew-resize;display:flex;align-items:center;min-width:120px;touch-action:none}
.slider .tr{position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--surface3)}
.slider .fi{position:absolute;left:0;height:4px;border-radius:2px;background:var(--c,var(--accent))}
.slider .th{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 1px 4px rgba(0,0,0,.6)}
.sval{font-family:var(--mono);font-size:12px;color:var(--t1);width:72px;text-align:right}

  function paintTree(){

  function paintIndex(){
    const FACETS=[['topic','Topics'],['api','APIs'],['group','Consumer groups'],['txn','Transactional IDs'],['client','Client IDs'],['broker','Brokers'],['outcome','Outcome']];

      const pool=REQS.filter(r=>matchAll(r,filters,f)), cnt={};
      for(const r of pool)for(const v of new Set(FIELD[f](r)))cnt[v]=(cnt[v]||0)+1;
      let vals=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
      if(!vals.length)return '';
      const mx=vals[0][1], cur=(filters.find(x=>x.f===f)||{vals:[]}).vals;
      let pats=[];
      if(f==='topic'){const pre={};for(const [v] of vals){const p=v.split('.')[0];(pre[p]=pre[p]||[]).push(v)}
        pats=Object.entries(pre).filter(([,v])=>v.length>1).map(([p])=>{const pat=p+'.*';return [pat,pool.filter(r=>FIELD.topic(r).some(x=>glob(pat,x))).length]})}
      const row=(v,c,pat)=>`<div class="fv ${cur.includes(v)?'on':''} ${pat?'pat':''}" data-ff="${f}" data-fv="${esc(v)}"><span class="bar" style="width:${Math.max(2,c/Math.max(mx,...pats.map(p=>p[1]))*100)}%"></span><span class="ck">${cur.includes(v)?ic('check',10):''}</span>${f==='api'?`<span class="sdot" style="width:6px;height:6px;border-radius:2px;background:${apiCat(v)}"></span>`:f==='client'?`<span class="sdot" style="background:${CL[v].color}"></span>`:f==='outcome'&&v!=='ok'?`<span class="sdot" style="background:${FAULT[v].c}"></span>`:''}<span class="nm">${esc(v)}</span><span class="c">${fmtN(c)}</span></div>`;
      return `<div class="facet"><h4>${l}<span class="t4">${vals.length}</span></h4>${pats.map(([p,c])=>row(p,c,true)).join('')}${vals.slice(0,f==='api'?8:6).map(([v,c])=>row(v,c)).join('')}${vals.length>(f==='api'?8:6)?`<div class="t4" style="font-size:11.5px;padding:3px 0">Show ${vals.length-(f==='api'?8:6)} more</div>`:''}</div>`;
    }).join('');

  function paintSheet(){
    const s=selector(), m=REQS.filter(r=>s.length&&matchAll(r,s));

    const groups=[['header','Request header'],['conn','Connection'],['body',`Body · ${API[selReq.api][0]}Request v${selReq.ver}`]];
    const yaml=s.length?s.map(f=>`  <span class="k">${{api:'api',client:'client_id',topic:'topic',conn:'connection',broker:'broker',acks:'acks',txn:'transactional_id',group:'group_id',partition:'partition',ver:'api_version',sw:'client_software'}[f.f]}</span>: ${f.vals.length>1?'['+f.vals.map(v=>`<span class="s">"${esc(v)}"</span>`).join(', ')+']':`<span class="s">"${esc(f.vals[0])}"</span>`}`).join('\n'):'  <span class="c"># nothing selected</span>';
    $('#right',app).innerHTML=`<div class="sh-h"><div style="display:flex;gap:8px;align-items:center">${apiPill(API[selReq.api][0],selReq.ver)}<span class="mono t4">#${selReq.seq}</span><span class="sp"></span><button class="ib" title="Copy as JSON">${ic('link')}</button><button class="ib" data-close>${ic('x')}</button></div>
        <div class="t1" style="font-size:15px;font-weight:600;margin-top:12px;letter-spacing:-.01em">Selector from this request</div>
        <div class="t3" style="font-size:12px;margin-top:3px">Tick the fields that identify “calls like this one”. Matching rows light up in the stream.</div>
        <div class="t4 mono" style="font-size:11px;margin-top:8px">${fmtT(selReq.t)} · ${selReq.client} #${selReq.conn} → b${selReq.broker} · ${selReq.lat} ms</div></div>
      ${groups.map(([g,l])=>`<div class="fgrp">${l}</div>`+selFields.map((f,i)=>f.g!==g?'':`<div class="fld ${f.on?'on':''} ${f.f?'':'info'}" data-fi="${i}" style="padding-left:${16+f.depth*14}px">${f.f?`<span class="cb">${f.on?ic('check',10):''}</span>`:'<span></span>'}<span class="k">${f.k}</span><span class="val">${f.alt?`<button class="gen ${f.gen?'on':''}" data-gen="${i}" title="Generalise">${esc(f.gen?f.alt:f.alt)}</button>`:''}${f.gen?`<span class="t4" style="text-decoration:line-through">${esc(f.d||f.v)}</span>`:esc(f.d||f.v)}</span></div>`).join('')).join('')}
      <div class="mcard"><div class="t3" style="font-size:12px;margin-bottom:4px">Matches in this recording</div>
        <div class="big">${fmtN(m.length)}<span>of ${fmtN(REQS.length)} calls · ${(m.length/REQS.length*100).toFixed(1)}% · ${conns} connections</span></div>
        <div style="margin-top:12px;display:flex;flex-direction:column;gap:2px">${Object.entries(byC).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="bd"><span style="display:flex;gap:7px;align-items:center"><span class="sdot" style="background:${CL[c].color}"></span>${c}</span><span class="b"><i style="width:${n/m.length*100}%;background:${CL[c].color}"></i></span><span class="n">${fmtN(n)}</span></div>`).join('')||'<span class="t4" style="font-size:12px">No matches.</span>'}</div></div>
      <div class="selx"><span class="c"># selector</span>\n<span class="k">match</span>:\n${yaml}</div>
      <div style="display:flex;gap:8px;padding:14px 16px 20px;flex-wrap:wrap"><button class="btn primary" id="ssave">${ic('hash')}Save selector</button><button class="btn" id="sinj">${ic('zap')}Inject on match…</button><button class="btn ghost" id="spad">${ic('grid')}Assign to pad row</button></div>`;
  }
  const repaint=()=>{paintFbar();paintStream(true);paintTree();sel?paintSheet():paintIndex()};
  paintCount();repaint();

  app.addEventListener('click',e=>{
    const rm=e.target.closest('[data-rm]'); if(rm){filters=filters.filter(f=>f.f!==rm.dataset.rm);repaint();return}
    if(e.target.closest('.main [data-rec]')){recording=!recording;if(recording)recStart=Date.now();show(cur);return}
    if(e.target.closest('[data-close]')){show(VIEWS.findIndex(v=>v.k==='record'));return}
    const gen=e.target.closest('[data-gen]'); if(gen){const f=selFields[+gen.dataset.gen];f.gen=!f.gen;f.on=true;repaint();return}
    const fi=e.target.closest('[data-fi]'); if(fi){const f=selFields[+fi.dataset.fi];if(f.f){f.on=!f.on;repaint()}return}
    const ff=e.target.closest('[data-ff]');
    if(ff&&!sel){const f=ff.dataset.ff,v=ff.dataset.fv,ex=filters.find(x=>x.f===f);
      if(ex){ex.vals.includes(v)?ex.vals.splice(ex.vals.indexOf(v),1):ex.vals.push(v);if(!ex.vals.length)filters.splice(filters.indexOf(ex),1)}else filters.push({f,vals:[v]});

      menu(inj,[{sec:'Inject on matching calls'},...['error','delay','blackhole','disconnect','throttle'].map(k=>({label:FAULT[k].l,k,icon:`<span class="sdot" style="background:${FAULT[k].c}"></span>`,d:{error:'NOT_LEADER',delay:'500 ms',blackhole:'never answer',disconnect:'close socket',throttle:'2 s'}[k]}))],it=>{

        const r={id:++RID,title:`${FAULT[it.k].l} on ${m.filter(f=>f.f!=='client').map(f=>f.vals.join('/')).join(' · ')||'selected calls'}`,desc:'Created from recorded traffic.',scope:cl?cl.vals[0]:'all',match:m.filter(f=>f!==cl),fault:it.k,code:'NOT_LEADER_OR_FOLLOWER',ms:500,jitter:0,thr:2000,prob:100,status:'active',pad:null,dur:'Until disabled'};
        RULES.push(r); selRule=r.id; toast(`Created <b>GMQ-${r.id}</b> · ${FAULT[it.k].l} for ${scopeName(r.scope)} <span class="t4">— open Rules (3)</span>`)});
      return}
    if(e.target.closest('#addf')){menu(e.target.closest('#addf'),Object.keys(FL).filter(k=>!['ver','sw','acks'].includes(k)).map(k=>({label:FL[k],icon:ic(FIC[k]),k})),it=>{toast(`Pick a ${FL[it.k].toLowerCase()} from the index on the right`)})}
  });

  timers.push(setInterval(()=>{
    if(!recording)return;
    const n=1+int(3);for(let i=0;i<n;i++)REQS.push(genReq());
    if(REQS.length>6000)REQS.splice(0,REQS.length-6000);
    paintCount(); const nav=$('.nav[data-go="record"] .cnt',app); if(nav)nav.textContent=fmtN(REQS.length);
    if(!sel){paintStream();tickN++;if(tickN%5===0){const idle=id=>!$(id,app).matches(':hover');if(idle('#right'))paintIndex();if(idle('#tree'))paintTree();if(idle('#fbar'))paintFbar()}}
  },450));
}
let tickN=0;
function fieldsOf(r){
  const F=[],add=(g,f,k,v,o={})=>F.push({g,f,k,v,on:false,gen:false,depth:0,...o});
  const name=API[r.api][0];
  add('header','api','api_key',name,{d:`${name} (${r.api})`,on:true});
  add('header','ver','api_version',String(r.ver));
  add('header','client','client_id',r.client,{on:true});
  add('header','sw','client_software',r.sw);
  add('conn','conn','connection','#'+r.conn,{d:`#${r.conn} · 10.0.4.${20+r.conn}:5${1200+r.conn*37}`});
  add('conn','broker','broker','b'+r.broker,{d:`b${r.broker} · ${BROKERS[r.broker-1].up}`});
  if(r.acks!=null)add('body','acks','acks',String(r.acks));
  if(r.api===0||r.txn)add('body','txn','transactional_id',r.txn||'null',{f:r.txn?'txn':null});
  if(r.group)add('body','group','group_id',r.group,{on:r.api!==1});
  r.topics.forEach((t,i)=>{
    const pre=t.name.split('.')[0], alt=TOPICS.filter(x=>x.startsWith(pre+'.')).length>1?pre+'.*':null;
    add('body','topic',`topics[${i}].name`,t.name,{alt,gen:!!alt,on:i===0});
    t.p.forEach(p=>add('body','partition',`partitions[].index`,String(p),{depth:1}));
  });
  if(r.records)add('body',null,'records',`${r.records} · ${fmtB(r.bytes)}`);
  return F;
}

function knobSvg(frac,color){

  const arc=(f,t)=>{const [x1,y1]=pt(f),[x2,y2]=pt(t);return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${t-f>180?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`};
  const end=a0+sw*Math.max(.001,Math.min(1,frac)),[hx,hy]=pt(end);
  return `<svg width="40" height="40" viewBox="0 0 40 40"><path d="${arc(a0,a0+sw)}" stroke="#25262b" stroke-width="3" fill="none" stroke-linecap="round"/>${frac>0?`<path d="${arc(a0,end)}" stroke="${color}" stroke-width="3" fill="none" stroke-linecap="round"/>`:''}<circle cx="20" cy="20" r="10.5" fill="#1b1c20" stroke="rgba(255,255,255,.09)"/><line x1="20" y1="20" x2="${(20+(hx-20)*.6).toFixed(2)}" y2="${(20+(hy-20)*.6).toFixed(2)}" stroke="#e8e9ec" stroke-width="1.7" stroke-linecap="round"/></svg>`;

const TEMPLATES=[
 ['Leader election','error produce fetch NOT_LEADER_OR_FOLLOWER 30% for 20s','Producers and consumers see the partition leader move'],
 ['Rebalance storm','error heartbeat REBALANCE_IN_PROGRESS analytics-etl 60%','Group members are told to rejoin over and over'],
 ['Slow broker','delay b2 2s 100%','Every call to broker 2 takes two seconds'],
 ['Fence the producer','error endtxn PRODUCER_FENCED payments-svc','Transactional producer gets fenced on commit'],
 ['Coordinator moves','error offsetcommit NOT_COORDINATOR 50% for 30s','Commits bounce while the coordinator moves'],

function parseCmd(s){
  const o={apis:[]}, toks=s.trim().split(/\s+/).filter(Boolean);
  const toMs=t=>{const m=t.match(/^(\d+(?:\.\d+)?)(ms|s|m)$/);return m?Math.round(+m[1]*({ms:1,s:1000,m:60000}[m[2]])):null};
  for(let i=0;i<toks.length;i++){
    const t=toks[i], l=t.toLowerCase(); let x;
    if(/^(delay|slow|lag|latency)$/.test(l))o.fault='delay';
    else if(/^(error|err|fail)$/.test(l))o.fault='error';
    else if(/^(blackhole|hang|timeout|drop)$/.test(l))o.fault='blackhole';
    else if(/^(disconnect|kill|close|reset)$/.test(l))o.fault='disconnect';
    else if(/^(throttle|quota)$/.test(l))o.fault='throttle';
    else if(l==='for'&&toks[i+1]){o.dur=toks[++i]}
    else if(toMs(l)!=null){o.fault==='throttle'?o.thr=toMs(l):o.ms=toMs(l)}
    else if(/^\d+%$/.test(l))o.prob=parseInt(l);
    else if(/^b\d$/.test(l))o.broker=l;
    else if((x=API_NAMES.find(a=>a.toLowerCase()===l||(l.length>=4&&a.toLowerCase().startsWith(l)))))o.apis.push(x);
    else if(l.length>=5&&(x=CODES.find(c=>c[0].toLowerCase().startsWith(l.replace(/-/g,'_')))))o.code=x[0];
    else if(l.length>=3&&(x=CLIENTS.find(c=>c.id.startsWith(l))))o.client=x.id;
    else if(l.includes('*')||TOPICS.includes(l))o.topic=l;
    else if((x=TOPICS.filter(tp=>tp.startsWith(l))).length&&l.length>=3)o.topic=x.length>1?(x.every(tp=>tp.startsWith(l.replace(/\.$/,'')+'.'))?l.replace(/\.$/,'')+'.*':l+'*'):x[0];
    else (o.unk=o.unk||[]).push(t);
  }
  if(o.code&&!o.fault)o.fault='error';
  return o;
}
function renderPalette(stage){
  renderRules(stage);
  const app=stage.firstElementChild;
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="palette"><div class="pal-top"><span class="tag">${ic('zap',11)}Quick inject</span><span class="tag t3">New rule</span></div>
    <div class="pal-in">${ic('search',16)}<input id="cmd" autocomplete="off" spellcheck="false" placeholder="delay produce orders.* 750ms 40% order-ingest" value="delay produce orders.* 750ms 40% order-ingest"></div>
    <div class="pal-prev" id="pprev"></div><div class="pal-list" id="plist"></div>
    <div class="pal-foot"><span><span class="kbd">↑</span><span class="kbd">↓</span>navigate</span><span><span class="kbd">↵</span>create &amp; enable</span><span><span class="kbd">⇧↵</span>save as draft</span><span><span class="kbd">⇥</span>complete</span><span class="sp"></span><span><span class="kbd">esc</span>close</span></div></div>`;
  app.appendChild(ov);
  const inp=$('#cmd',ov); let items=[], hi=0;
  const defCode=o=>o.code||(o.apis.some(a=>['FindCoordinator','JoinGroup','SyncGroup','Heartbeat','OffsetCommit'].includes(a))?'COORDINATOR_NOT_AVAILABLE':'NOT_LEADER_OR_FOLLOWER');
  function toRule(o,status){
    const m=[];if(o.apis.length)m.push({f:'api',vals:o.apis});if(o.topic)m.push({f:'topic',vals:[o.topic]});if(o.broker)m.push({f:'broker',vals:[o.broker]});
    const f=o.fault||'delay';
    return {id:++RID,title:`${FAULT[f].l} ${o.apis.join(' + ')||(o.broker?'broker '+o.broker.slice(1):'all calls')}${o.topic?' on '+o.topic:''}`,desc:`Created with ⌘K: “${inp.value.trim()}”`,scope:o.client||'all',match:m.length?m:[{f:'api',vals:API_NAMES}],fault:f,code:defCode(o),ms:o.ms??500,jitter:0,thr:o.thr??2000,prob:o.prob??100,status,pad:null,dur:o.dur?o.dur:'Until disabled'};
  }
  function paint(){
    const o=parseCmd(inp.value), f=o.fault;
    const T=(txt,def,extra='')=>`<span class="tok ${def?'def':''}" ${extra}>${txt}</span>`;
    let h=f?`<span class="fault tok" style="--c:${FAULT[f].c}">${FAULT[f].l}</span>`:T('fault?',1);
    h+=o.apis.length?o.apis.map(a=>apiPill(a)).join(''):o.broker?'':T('any API',1);
    if(o.broker)h+=`<span>on</span>`+T(ic('server',11)+'broker '+o.broker.slice(1));
    h+=`<span>on</span>`+(o.topic?T(ic('topic',11)+esc(o.topic)):T('any topic',1));
    h+=`<span>for</span>`+(o.client?T(`<span class="sdot" style="background:${CL[o.client].color}"></span>${o.client}`):T('all clients',1));
    if(f==='delay')h+=`<span>by</span>`+(o.ms!=null?T(fmtMs(o.ms)):T('500 ms',1));
    if(f==='throttle')h+=`<span>by</span>`+(o.thr!=null?T(fmtMs(o.thr)):T('2 s',1));
    if(f==='error')h+=`<span>with</span>`+T(`<span class="mono">${defCode(o)}</span>`,!o.code);
    h+=`<span>·</span>`+(o.prob!=null?T(o.prob+'%'):T('100%',1))+`<span>·</span>`+(o.dur?T('for '+esc(o.dur)):T('until disabled',1));
    const sim=toRule(o,'draft');RID--;
    const n=REQS.filter(q=>(sim.scope==='all'||q.client===sim.scope)&&matchAll(q,sim.match)).length;
    h+=`<span class="est">≈ <b>${fmtN(n)}</b> recorded calls match${o.unk?` · <span style="color:var(--orange)">ignored: ${esc(o.unk.join(' '))}</span>`:''}</span>`;
    $('#pprev',ov).innerHTML=h;
    const last=inp.value.endsWith(' ')?'':(inp.value.trim().split(/\s+/).pop()||'').toLowerCase();
    const comp=last.length>=1?[
      ...['delay','error','blackhole','disconnect','throttle'].filter(x=>x.startsWith(last)&&x!==last).map(x=>({t:'fault',v:x,l:FAULT[x].l,d:'fault'})),
      ...API_NAMES.filter(a=>a.toLowerCase().startsWith(last)&&a.toLowerCase()!==last).map(a=>({t:'api',v:a.toLowerCase(),l:apiPill(a),d:'Kafka API'})),
      ...TOPICS.filter(t=>t.startsWith(last)&&t!==last).map(t=>({t:'topic',v:t,l:esc(t),d:'topic · seen in recording'})),
      ...CLIENTS.filter(c=>c.id.startsWith(last)&&c.id!==last).map(c=>({t:'client',v:c.id,l:c.id,d:'client.id · '+c.conns.length+' connections'})),
      ...CODES.filter(c=>last.length>=3&&c[0].toLowerCase().startsWith(last)).map(c=>({t:'code',v:c[0],l:`<span class="mono">${c[0]}</span>`,d:'error '+c[1]})),
    ].slice(0,5):[];
    items=[{a:'create',l:`Create <b class="t1">${esc(sim.title)}</b>`,d:scopeName(sim.scope),icon:ic('plus'),k:['↵']},...comp.map(c=>({a:'comp',...c,icon:ic('chevr'),k:['⇥']})),...TEMPLATES.map((t,i)=>({a:'tpl',l:t[0],d:t[2],cmd:t[1],icon:ic('spark'),k:[]})),{a:'go',l:'Open pad grid',d:'Pads',v:'pads',icon:ic('grid'),k:[]},{a:'go',l:'Build selector from recorded traffic',d:'Live traffic',v:'record',icon:ic('rec'),k:[]}];
    if(hi>=items.length)hi=0;
    let lastSec='';
    $('#plist',ov).innerHTML=items.map((it,i)=>{const sec={create:'',comp:'Complete',tpl:'Scenarios',go:'Jump to'}[it.a];const sh=sec&&sec!==lastSec?`<div class="pal-sec">${sec}</div>`:'';lastSec=sec;
      return sh+`<div class="pal-it ${i===hi?'on':''}" data-i="${i}">${it.icon}<span>${it.l}</span><span class="d">${esc(it.d||'')}${it.cmd?` — <span class="mono">${esc(it.cmd)}</span>`:''}</span><span class="r">${it.k.map(k=>`<span class="kbd">${k}</span>`).join('')}</span></div>`}).join('');
  }
  function run(it,shift){
    if(it.a==='create'){const r=toRule(parseCmd(inp.value),shift?'draft':'active');RULES.push(r);selRule=r.id;toast(`Created <b>GMQ-${r.id}</b> · ${esc(r.title)}`);show(VIEWS.findIndex(v=>v.k==='rules'))}
    else if(it.a==='comp'){const p=inp.value.replace(/\S*$/,'');inp.value=p+it.v+' ';hi=0;paint();inp.focus()}
    else if(it.a==='tpl'){inp.value=it.cmd;hi=0;paint();inp.focus()}
    else if(it.a==='go')show(VIEWS.findIndex(v=>v.k===it.v));
  }
  inp.addEventListener('input',()=>{hi=0;paint()});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){hi=(hi+1)%items.length;paint();e.preventDefault()}
    else if(e.key==='ArrowUp'){hi=(hi-1+items.length)%items.length;paint();e.preventDefault()}
    else if(e.key==='Enter'){run(items[hi],e.shiftKey);e.preventDefault()}
    else if(e.key==='Tab'){const c=items.find(x=>x.a==='comp');if(c)run(c);e.preventDefault()}
    else if(e.key==='Escape'){show(VIEWS.findIndex(v=>v.k==='rules'))}
  });
  ov.addEventListener('click',e=>{const it=e.target.closest('.pal-it');if(it){run(items[+it.dataset.i]);return}if(e.target===ov)show(VIEWS.findIndex(v=>v.k==='rules'))});
  paint(); setTimeout(()=>{inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)},30);
}

/* ════════════════════════ mockup switcher ════════════════════════ */
const VIEWS=[
 {k:'record',name:'Record',desc:'Live traffic per connection with an auto-built index of topics, APIs, groups. Click anything to filter, then save as selector or inject.',render:s=>renderRecord(s,'live')},
 {k:'selector',name:'Selector from request',desc:'Click a recorded call, tick the fields that identify “calls like this one”, generalise orders.eu → orders.*, see matches light up.',render:s=>renderRecord(s,'select')},
 {k:'rules',name:'Rules',desc:'Linear-style list grouped by scope (all clients / per client / brokers) with an inspector to tune fault, probability, duration and pad.',render:renderRules},
 {k:'pads',name:'Pads',desc:'8×8 pad grid for a Push-style controller: rows = selectors, columns = faults, encoders tune the focused pad, bottom row = scope.',render:renderPads},
 {k:'clients',name:'Clients',desc:'Board with one column per client (plus everyone and brokers). Drag rules between columns to re-scope them.',render:renderClients},
 {k:'palette',name:'Quick inject ⌘K',desc:'Type a sentence, get a rule: “delay produce orders.* 750ms 40% order-ingest”. Scenario templates for common failure stories.',render:renderPalette},
];
let cur=0, timers=[];
function show(i){
  if(i<0)i=0; timers.forEach(clearInterval); timers=[]; padKeys=null; $$('.menu').forEach(m=>m.remove());
  cur=i; $$('#mtabs button').forEach((b,j)=>b.classList.toggle('on',j===i)); $('#mdesc').textContent=VIEWS[i].desc;
  VIEWS[i].render($('#stage')); history.replaceState(null,'','#'+VIEWS[i].k);
}
$('#mtabs').innerHTML=VIEWS.map((v,i)=>`<button data-v="${i}"><span class="n">${i+1}</span>${v.name}</button>`).join('');
$('#mtabs').addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)show(+b.dataset.v)});
document.addEventListener('keydown',e=>{
  const typing=e.target.closest('input,[contenteditable]');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();show(VIEWS.findIndex(v=>v.k==='palette'));return}
  if(typing)return;
  if(VIEWS[cur].k==='pads'&&/^[1-5]$/.test(e.key)){pScope=PSCOPES[+e.key-1].id;show(cur);return}
  if(padKeys&&padKeys(e))return;
  if(/^[1-6]$/.test(e.key)){show(+e.key-1);return}
  if(e.key.toLowerCase()==='r'&&!e.metaKey){recording=!recording;if(recording)recStart=Date.now();show(cur)}
  if(e.key.toLowerCase()==='c'&&VIEWS[cur].k==='rules'){$('#newRule')?.click();e.preventDefault()}
});
setInterval(()=>$$('[data-elapsed]').forEach(el=>{if(recording)el.textContent=elapsed()}),1000);
show(Math.max(0,VIEWS.findIndex(v=>'#'+v.k===location.hash)));
</script>
