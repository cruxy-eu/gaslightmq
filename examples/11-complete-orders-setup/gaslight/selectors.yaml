# Which calls. Rules and filters refer to these by name.

- name: order-producers
  title: Order producers
  match:
    api: Produce
    topic: "orders.*"

- name: order-fetches
  title: Order fetches
  match:
    api: Fetch
    topic: "orders.*"

- name: group-coordination
  title: Group coordination
  match:
    api: [FindCoordinator, JoinGroup, SyncGroup, Heartbeat, ConsumerGroupHeartbeat]
