# An exact test case: the consumer keeps reading while the leader churns.
name: consumer-survives-leader-churn
uuid: 01a20cc8-9176-7f6a-ad94-46c36773cec2
title: Consumer survives leader churn
mode: sequence
seed: 7

steps:
  - name: warm-up
    title: Warm up
    until: { calls: 100, selector: order-fetches }

  - name: leader-churn
    title: Leader churn
    arm: [refuse-with-not-leader]
    # A budget: exactly three refusals, however many connections fetch at once.
    until: { firings: 3, rule: refuse-with-not-leader }

  - name: slow-recovery
    title: Slow recovery
    arm: [order-fetches-are-slow-for-analytics]
    until: { after: 20s }

  - name: back-to-normal
    title: Back to normal
