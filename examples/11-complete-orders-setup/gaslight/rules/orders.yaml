# Rules: a selector, a lie and a trigger. They load disarmed.

- name: orders-sometimes-fail
  title: Orders sometimes fail
  selector: order-producers
  action: error-retriable
  trigger:
    chance: 20%

- name: order-fetches-are-slow-for-analytics
  title: Order fetches are slow for analytics
  selector: order-fetches
  scope:
    client.id: analytics-etl
  action: delay-1s
  trigger:
    chance: 30%

- name: every-hundredth-order-fetch-hangs
  title: Every hundredth order fetch hangs
  selector: order-fetches
  action: blackhole
  trigger:
    every: 100

- name: refuse-with-not-leader
  title: Refuse with NOT_LEADER
  selector: order-fetches
  action: error-retriable
