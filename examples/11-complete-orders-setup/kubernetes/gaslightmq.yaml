# A proxy in front of the real staging cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaslightmq
spec:
  replicas: 1                       # live state is in memory: one pod
  selector:
    matchLabels: { app: gaslightmq }
  template:
    metadata:
      labels: { app: gaslightmq }
    spec:
      initContainers:
        # The workspace lives in git. Clone it instead of copying files into config maps.
        - name: workspace
          image: alpine/git:latest
          args: [clone, --depth=1, "https://github.com/example/orders-gaslight.git", /workspace]
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
      containers:
        - name: gaslightmq
          image: ghcr.io/cruxy-eu/gaslightmq:latest
          args:
            - start
            - --workspace=/workspace/gaslight
            - --env=staging-proxy
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: control, containerPort: 7092 }
          volumeMounts:
            - { name: workspace, mountPath: /workspace, readOnly: true }
            # The environment file refers to /run/secrets/kafka/password and ca.pem.
            - { name: kafka-secret, mountPath: /run/secrets/kafka, readOnly: true }
            - { name: recordings, mountPath: /recordings }
          env:
            - { name: GMQ_RECORDINGS_DIRECTORY, value: /recordings }
      volumes:
        - name: workspace
          emptyDir: {}
        - name: kafka-secret
          secret: { secretName: gaslightmq-kafka }
        - name: recordings
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gaslightmq
spec:
  selector: { app: gaslightmq }
  ports:
    - { name: kafka, port: 9092 }
    - { name: control, port: 7092 }
    # One port per upstream broker. The environment file pins the range.
    - { name: broker-1, port: 19092 }
    - { name: broker-2, port: 19093 }
    - { name: broker-3, port: 19094 }
