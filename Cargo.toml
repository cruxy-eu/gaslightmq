[workspace]
members = [
    "crates/gaslightmq",
    "bins/*",
    "crates/gaslightmq-kernel",
    "crates/gaslightmq-logging",
    "crates/gaslightmq-wire",
    "crates/gaslightmq-proxy",
    "crates/gaslightmq-proxy-api",
    "crates/gaslightmq-proxy-ui",
    "crates/gaslightmq-scenario",
    "crates/gaslightmq-testcontainers",
    "crates/gaslightmq-testing",
    "crates/gaslightmq-kafka-client/*",
]
# The UI is a wasm app built with `dx`; keep it out of plain `cargo build`.
default-members = [
    "crates/gaslightmq",
    "bins/*",
    "crates/gaslightmq-kernel",
    "crates/gaslightmq-logging",
    "crates/gaslightmq-wire",
    "crates/gaslightmq-proxy",
    "crates/gaslightmq-proxy-api",
    "crates/gaslightmq-scenario",
    "crates/gaslightmq-testcontainers",
    "crates/gaslightmq-testing",
    "crates/gaslightmq-kafka-client/*",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
gaslightmq = { path = "crates/gaslightmq" }
gaslightmq-kernel = { path = "crates/gaslightmq-kernel" }
gaslightmq-scenario = { path = "crates/gaslightmq-scenario" }
gaslightmq-testing = { path = "crates/gaslightmq-testing" }
gaslightmq-kafka-client-api = { path = "crates/gaslightmq-kafka-client/api" }
gaslightmq-kafka-client-native = { path = "crates/gaslightmq-kafka-client/native" }
gaslightmq-logging = { path = "crates/gaslightmq-logging" }
gaslightmq-wire = { path = "crates/gaslightmq-wire" }
gaslightmq-proxy = { path = "crates/gaslightmq-proxy" }
gaslightmq-proxy-api = { path = "crates/gaslightmq-proxy-api" }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = "4"
dioxus = "0.7.10"
fake = "3"
futures = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["websocket"] }
gloo-timers = { version = "0.3", features = ["futures"] }
indexmap = "2"
kafka-protocol = "0.17"
rand = "0.9"
rust-embed = "8"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
testcontainers = "0.27"
tokio = "1"
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = "1"
web-sys = { version = "0.3", features = ["Window", "Location"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Used by `dx build --release --platform web`. `strip = true` would make dx
# run `objcopy --strip-all` on the wasm, which drops wasm-bindgen's custom
# sections ("import ... doesn't have an adapter listed").
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
