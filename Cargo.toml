[workspace]
members = [
    "crates/gaslightmq-kernel",
    "crates/gaslightmq-wire",
    "crates/gaslightmq-kafka-client/*",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
gaslightmq-kernel = { path = "crates/gaslightmq-kernel" }
gaslightmq-kafka-client-api = { path = "crates/gaslightmq-kafka-client/api" }
gaslightmq-kafka-client-native = { path = "crates/gaslightmq-kafka-client/native" }
gaslightmq-wire = { path = "crates/gaslightmq-wire" }
anyhow = "1"
bytes = "1"
futures = "0.3"
indexmap = "2"
kafka-protocol = "0.17"
tokio = "1"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Used by `dx build --release --platform web`. `strip = true` would make dx
# run `objcopy --strip-all` on the wasm, which drops wasm-bindgen's custom
# sections ("import ... doesn't have an adapter listed").
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
