[workspace]
members = [
    "crates/gaslightmq_call",
    "crates/gaslightmq_clock",
    "crates/gaslightmq_combine",
    "crates/gaslightmq_environment",
    "crates/gaslightmq_field",
    "crates/gaslightmq_incident",
    "crates/gaslightmq_kernel",
    "crates/gaslightmq_lie",
    "crates/gaslightmq_lie_api",
    "crates/gaslightmq_lie_refusal",
    "crates/gaslightmq_listener",
    "crates/gaslightmq_pipeline",
    "crates/gaslightmq_rule",
    "crates/gaslightmq_selector",
    "crates/gaslightmq_session",
    "crates/gaslightmq_trigger",
    "crates/gaslightmq_wire",
    "crates/gaslightmq_wire_edit",
    "crates/gaslightmq_kafka_client/*",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gaslightmq_call = { path = "crates/gaslightmq_call" }
gaslightmq_clock = { path = "crates/gaslightmq_clock" }
gaslightmq_combine = { path = "crates/gaslightmq_combine" }
gaslightmq_field = { path = "crates/gaslightmq_field" }
gaslightmq_incident = { path = "crates/gaslightmq_incident" }
gaslightmq_kafka_client_api = { path = "crates/gaslightmq_kafka_client/api" }
gaslightmq_kernel = { path = "crates/gaslightmq_kernel" }
gaslightmq_lie = { path = "crates/gaslightmq_lie" }
gaslightmq_lie_api = { path = "crates/gaslightmq_lie_api" }
gaslightmq_lie_refusal = { path = "crates/gaslightmq_lie_refusal" }
gaslightmq_rule = { path = "crates/gaslightmq_rule" }
gaslightmq_selector = { path = "crates/gaslightmq_selector" }
gaslightmq_session = { path = "crates/gaslightmq_session" }
gaslightmq_trigger = { path = "crates/gaslightmq_trigger" }
gaslightmq_wire = { path = "crates/gaslightmq_wire" }
gaslightmq_wire_edit = { path = "crates/gaslightmq_wire_edit" }
arc-swap = "1"
bytes = "1"
futures = "0.3"
indexmap = "2"
kafka-protocol = "0.17"
# Only the checks in `xtask/` parse Rust. Line numbers come from `span-locations`.
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_test = "1"
syn = { version = "3", default-features = false, features = ["full", "parsing", "visit"] }
tokio = "1"
tracing = "0.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Noise: wants `#[must_use]` on every public getter, yet skips the ones that touch `Bytes` or a mutex.
must_use_candidate = "allow"
# A library returns its error; it doesn't panic, and it leaves no debugging behind.
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# An exception is an `#[expect]` with a reason, so it warns once it is no longer needed.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Used by `dx build --release --platform web`. `strip = true` would make dx
# run `objcopy --strip-all` on the wasm, which drops wasm-bindgen's custom
# sections ("import ... doesn't have an adapter listed").
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
