[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
gmq_wire = { path = "crates/gmq_wire" }
bytes = "1"
futures = "0.3"
indexmap = "2"
kafka-protocol = "0.17"
tokio = "1"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Used by `dx build --release --platform web`. `strip = true` would make dx
# run `objcopy --strip-all` on the wasm, which drops wasm-bindgen's custom
# sections ("import ... doesn't have an adapter listed").
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
