    "crates/gaslightmq_call",
    "crates/gaslightmq_clock",
    "crates/gaslightmq_clock_waitable",
    "crates/gaslightmq_combine",
    "crates/gaslightmq_control_api",
    "crates/gaslightmq_control_client",
    "crates/gaslightmq_control_server",
    "crates/gaslightmq_engine",
    "crates/gaslightmq_environment",
    "crates/gaslightmq_environment/conformance",
    "crates/gaslightmq_field",
    "crates/gaslightmq_host",
    "crates/gaslightmq_incident",
    "crates/gaslightmq_index",
    "crates/gaslightmq_journal",
    "crates/gaslightmq_kernel",
    "crates/gaslightmq_lie",
    "crates/gaslightmq_lie_api",
    "crates/gaslightmq_lie_refusal",
    "crates/gaslightmq_listener",
    "crates/gaslightmq_overlay",
    "crates/gaslightmq_pipeline",
    "crates/gaslightmq_quick_inject",
    "crates/gaslightmq_recording",
    "crates/gaslightmq_recording/conformance",
    "crates/gaslightmq_recording_compression",
    "crates/gaslightmq_recording_segments",
    "crates/gaslightmq_recording_segments/conformance",
    "crates/gaslightmq_recording_segments_fs",
    "crates/gaslightmq_resource",
    "crates/gaslightmq_rule",
    "crates/gaslightmq_rule/conformance",
    "crates/gaslightmq_scenario",
    "crates/gaslightmq_scenario/conformance",
    "crates/gaslightmq_selector",
    "crates/gaslightmq_selector/conformance",
    "crates/gaslightmq_session",
    "crates/gaslightmq_surface",
    "crates/gaslightmq_surface/conformance",
    "crates/gaslightmq_test",
    "crates/gaslightmq_test_kafka",
    "crates/gaslightmq_traffic",
    "crates/gaslightmq_trigger",
    "crates/gaslightmq_ui",
    "crates/gaslightmq_wire",
    "crates/gaslightmq_wire_edit",
    "crates/gaslightmq_workspace",
    "crates/gaslightmq_workspace_fs",
    "crates/gaslightmq_definition/*",
    "crates/gaslightmq_kafka_client/*",
    "crates/gmq",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gaslightmq_backend = { path = "crates/gaslightmq_backend" }
gaslightmq_backend_upstream = { path = "crates/gaslightmq_backend_upstream" }
gaslightmq_call = { path = "crates/gaslightmq_call" }
gaslightmq_clock = { path = "crates/gaslightmq_clock" }
gaslightmq_clock_waitable = { path = "crates/gaslightmq_clock_waitable" }
gaslightmq_combine = { path = "crates/gaslightmq_combine" }
gaslightmq_control_api = { path = "crates/gaslightmq_control_api" }
gaslightmq_control_client = { path = "crates/gaslightmq_control_client" }
gaslightmq_control_server = { path = "crates/gaslightmq_control_server" }
gaslightmq_definition_api = { path = "crates/gaslightmq_definition/api" }
gaslightmq_definition_conformance = { path = "crates/gaslightmq_definition/conformance" }
gaslightmq_definition_memory = { path = "crates/gaslightmq_definition/memory" }
gaslightmq_engine = { path = "crates/gaslightmq_engine" }
gaslightmq_environment = { path = "crates/gaslightmq_environment" }
gaslightmq_environment_conformance = { path = "crates/gaslightmq_environment/conformance" }
gaslightmq_field = { path = "crates/gaslightmq_field" }
gaslightmq_host = { path = "crates/gaslightmq_host" }
gaslightmq_incident = { path = "crates/gaslightmq_incident" }
gaslightmq_journal = { path = "crates/gaslightmq_journal" }
gaslightmq_kafka_client_api = { path = "crates/gaslightmq_kafka_client/api" }
gaslightmq_kafka_client_native = { path = "crates/gaslightmq_kafka_client/native" }
gaslightmq_kernel = { path = "crates/gaslightmq_kernel" }
gaslightmq_lie = { path = "crates/gaslightmq_lie" }
gaslightmq_lie_api = { path = "crates/gaslightmq_lie_api" }
gaslightmq_lie_refusal = { path = "crates/gaslightmq_lie_refusal" }
gaslightmq_listener = { path = "crates/gaslightmq_listener" }
gaslightmq_overlay = { path = "crates/gaslightmq_overlay" }
gaslightmq_pipeline = { path = "crates/gaslightmq_pipeline" }
gaslightmq_quick_inject = { path = "crates/gaslightmq_quick_inject" }
gaslightmq_recording = { path = "crates/gaslightmq_recording" }
gaslightmq_recording_compression = { path = "crates/gaslightmq_recording_compression" }
gaslightmq_recording_conformance = { path = "crates/gaslightmq_recording/conformance" }
gaslightmq_recording_segments = { path = "crates/gaslightmq_recording_segments" }
gaslightmq_recording_segments_conformance = { path = "crates/gaslightmq_recording_segments/conformance" }
gaslightmq_recording_segments_fs = { path = "crates/gaslightmq_recording_segments_fs" }
gaslightmq_resource = { path = "crates/gaslightmq_resource" }
gaslightmq_rule = { path = "crates/gaslightmq_rule" }
gaslightmq_rule_conformance = { path = "crates/gaslightmq_rule/conformance" }
gaslightmq_scenario = { path = "crates/gaslightmq_scenario" }
gaslightmq_scenario_conformance = { path = "crates/gaslightmq_scenario/conformance" }
gaslightmq_selector = { path = "crates/gaslightmq_selector" }
gaslightmq_selector_conformance = { path = "crates/gaslightmq_selector/conformance" }
gaslightmq_session = { path = "crates/gaslightmq_session" }
gaslightmq_surface = { path = "crates/gaslightmq_surface" }
gaslightmq_surface_conformance = { path = "crates/gaslightmq_surface/conformance" }
gaslightmq_test_kafka = { path = "crates/gaslightmq_test_kafka" }
gaslightmq_traffic = { path = "crates/gaslightmq_traffic" }
gaslightmq_trigger = { path = "crates/gaslightmq_trigger" }
gaslightmq_wire = { path = "crates/gaslightmq_wire" }
gaslightmq_wire_edit = { path = "crates/gaslightmq_wire_edit" }
gaslightmq_workspace = { path = "crates/gaslightmq_workspace" }
gaslightmq_workspace_fs = { path = "crates/gaslightmq_workspace_fs" }
# Only tests and examples use it: they return `anyhow::Result<()>`. No crate names it in its API or outside them.
anyhow = "1"
arc-swap = "1"
# Only `gaslightmq_control_server` names it: the HTTP and WebSocket server of the control plane.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
bytes = "1"
# Only `gmq` names it: the flags and the environment variables of the binary.
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
# Only `gaslightmq_wire` and `gaslightmq_recording_segments` name it. `wire`: the checksum of a record batch whose
# attributes it wrote again. It is the checksum that Kafka gives its record batches, and `kafka-protocol` builds with
# the same crate. `recording_segments`: the checksum of every header, record and chunk of a recording, as stored.
crc32c = "0.6"
# Only `gaslightmq_ui` names it: the web UI, a Dioxus application. The renderer of the browser comes on wasm32 alone.
dioxus = { version = "0.7", default-features = false, features = ["lib", "launch", "router"] }
futures = "0.3"
# Only what reads the randomness of the system names it: whatever puts a process together, once, for the ID of
# the run, and the control server, for the ID of each presence.
getrandom = "0.4"
# Only `gaslightmq_control_client` names `gloo-net`, for the browser's own fetch and WebSocket.
# It and `gaslightmq_ui` name `gloo-timers`, for the timers of the browser.
gloo-net = { version = "0.8", default-features = false, features = ["http", "websocket"] }
gloo-timers = { version = "0.4", features = ["futures"] }
indexmap = "2"
kafka-protocol = "0.17"
# Only `gaslightmq_recording_segments_fs` names it: a sealed segment is mapped into memory, and its bytes go to the
# codec as ranges of the map.
memmap2 = "0.9"
# Only the checks in `xtask/` parse Rust. Line numbers come from `span-locations`.
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
# Only tests name it: the codec of recordings checks that whatever it packs unpacks to the same bytes.
proptest = "1"
# Only `gaslightmq_recording` names it: a message of a recording is the archive of a stored type, read in place.
# The features say the bytes that a recording holds: the lowest byte first, references of 32 bits, and every value at
# the address that its type asks for. Another set of them is another version of the encoding.
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "aligned"] }
# Only `gaslightmq_control_client` names it, for HTTP from a native target. Plain HTTP: no TLS, no proxy.
reqwest = { version = "0.13", default-features = false }
# Only `gaslightmq_control_server` names it, for the files of the UI that it serves. A build without the files of the UI
# serves a page that says how to build them. In a debug build the files are read from the folder, in a release build
# they ship inside the binary.
rust-embed = { version = "8", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only `gaslightmq_workspace_fs` names it: the path of the key that a file of a workspace failed to read at.
serde_path_to_error = "0.1"
# Reads YAML into serde types. The `ci-parity` check in `xtask/` reads the CI workflow with it.
# `gaslightmq_workspace_fs` reads and writes the files of a workspace with it, and finds their comments.
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_test = "1"
syn = { version = "3", default-features = false, features = ["full", "parsing", "visit"] }
# Only tests name it: the directories of a workspace that a test writes, gone when the test ends.
tempfile = "3"
# Only error types use it: it derives `Error` and the message. No error has a source, see the `wrapped-errors` check.
thiserror = "2"
tokio = "1"
# Only `gaslightmq_control_client` names it, for the WebSocket from a native target. Plain `ws`: no TLS.
tokio-tungstenite = "0.30"
tracing = "0.1"
# Only `gmq` names it: the log output of the binary, which writes what the crates log through `tracing`.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# Only `gaslightmq_control_client` names it, for the address of a control plane.
url = "2"
# Only `gaslightmq_ui` names it, on wasm32, for the address of the page that the browser shows.
web-sys = { version = "0.3", features = ["Location", "Window"] }
# Only `gaslightmq_recording_compression` names it: Zstandard, the first codec of a recording.
# `experimental` lets a block unpack into its own buffer, which the decoder then reads back from, so no second copy
# of the block is made.
zstd-safe = { version = "7", default-features = false, features = ["std", "experimental"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Noise: wants `#[must_use]` on every public getter, yet skips the ones that touch `Bytes` or a mutex.
must_use_candidate = "allow"
# A library returns its error; it doesn't panic, and it leaves no debugging behind.
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# An exception is an `#[expect]` with a reason, so it warns once it is no longer needed.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
# No `panic = "abort"`: a panic unwinds, so the listener keeps a handler's panic to its own connection.

# Used by `dx build --release --platform web`. `strip = true` would make dx
# run `objcopy --strip-all` on the wasm, which drops wasm-bindgen's custom
# sections ("import ... doesn't have an adapter listed").
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
