[package]
name = "gaslightmq"
version.workspace = true
edition.workspace = true

[features]
rdkafka = []

[dependencies]
gaslightmq-kernel.workspace = true
gaslightmq-scenario.workspace = true
anyhow.workspace = true
bytes.workspace = true
indexmap.workspace = true
kafka-protocol.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "rt-multi-thread", "macros", "sync"] }
futures.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
fake = { workspace = true, features = ["derive"] }
rand.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
gaslightmq-kernel.workspace = true
gaslightmq-testing.workspace = true
gaslightmq-kafka-client-api.workspace = true
gaslightmq-kafka-client-rdkafka.workspace = true
bytes.workspace = true
indexmap.workspace = true
kafka-protocol.workspace = true
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros"] }
