[package]
name = "gaslightmq"
version.workspace = true
edition.workspace = true

[dependencies]
gaslightmq-kernel = { path = "../gaslightmq-kernel" }
anyhow = "1"
bytes = "1"
indexmap = "2"
kafka-protocol = "0.17"
tokio = { version = "1", features = ["net", "io-util", "time", "rt-multi-thread", "macros", "sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
fake = { version = "3", features = ["derive"] }
rand = "0.9"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
gaslightmq-kernel = { path = "../gaslightmq-kernel" }
gaslightmq-testing = { path = "../gaslightmq-testing" }
gaslightmq-kafka-client-api = { path = "../gaslightmq-kafka-client/api" }
bytes = "1"
indexmap = "2"
kafka-protocol = "0.17"
tokio = { version = "1", features = ["test-util", "rt-multi-thread", "macros"] }
